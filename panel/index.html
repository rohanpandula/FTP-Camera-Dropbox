<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Local control panel for Camera Dropbox: monitor intake, browse accepted files, resolve exceptions, and tune automations.">
<meta name="theme-color" content="#e9ece5">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Camera Dropbox">
<meta property="og:description" content="Your camera sends. This box checks and files.">
<title>Camera Dropbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23171a18'/%3E%3Cpath d='M8 32h48' stroke='%23ee3f29' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23e9ece5' stroke='%23171a18' stroke-width='5'/%3E%3C/svg%3E">
<style>
  @font-face {
    font-family: "Big Shoulders";
    src: url("/assets/big-shoulders.woff2?v=1") format("woff2");
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
  }

  :root {
    color-scheme: light;
    --paper: #e9ece5;
    --sheet: #f8f9f5;
    --sheet-2: #dfe4dc;
    --ink: #171a18;
    --ink-soft: #505751;
    --ink-faint: #5c645e;
    --rule: #aeb5ae;
    --rule-dark: #747b75;
    --signal: #ee3f29;
    --signal-dark: #a61f13;
    --signal-fill: #d52f18; /* vermilion deep enough for white text at 4.9:1 */
    --link: #1748c7;
    --healthy: #08744f;
    --warning: #9b4a00;
    --danger: #a61f13;
    --focus: #1748c7;
    --display: "Big Shoulders", "Arial Narrow", sans-serif;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --paper-texture: url("/assets/archival-paper.webp?v=1");
    --paper-wash: linear-gradient(rgb(233 236 229 / .7), rgb(233 236 229 / .7)), var(--paper-texture);
    --sheet-wash: linear-gradient(rgb(248 249 245 / .74), rgb(248 249 245 / .74)), var(--paper-texture);
    --max: 1440px;
    --gutter: clamp(16px, 2.5vw, 32px);
    --header-h: 56px;
    --s1: 4px;
    --s2: 8px;
    --s3: 12px;
    --s4: 16px;
    --s6: 24px;
    --s8: 32px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-width: 320px;
    background-color: var(--paper);
    background-image: var(--paper-wash);
    background-size: auto, 512px 512px;
    color: var(--ink);
    font: 14px/1.45 var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button, input, select { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button { color: inherit; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  .skip-link {
    position: fixed;
    left: 16px;
    top: 12px;
    z-index: 100;
    padding: 10px 14px;
    background: var(--ink);
    color: var(--sheet);
    transform: translateY(-160%);
    transition: transform 180ms ease-out;
  }
  .skip-link:focus { transform: translateY(0); }

  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  /* Header: one 56px index bar. Wordmark, tabs, live state. */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 20;
    background-color: var(--paper);
    background-image: var(--paper-wash);
    background-size: auto, 512px 512px;
    border-bottom: 1px solid var(--ink);
  }
  .header-inner {
    width: min(100%, var(--max));
    height: var(--header-h);
    margin: 0 auto;
    display: flex;
    align-items: stretch;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 var(--gutter);
    border-right: 1px solid var(--rule-dark);
    color: var(--ink);
    text-decoration: none;
  }
  .brand-mark {
    position: relative;
    width: 22px;
    height: 22px;
    flex: none;
    border: 1px solid var(--ink);
  }
  .brand-mark::before {
    content: "";
    position: absolute;
    left: -1px;
    right: -1px;
    top: 9px;
    height: 3px;
    background: var(--signal);
  }
  .brand-mark::after {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: var(--sheet);
    border: 2px solid var(--ink);
  }
  .brand-name {
    white-space: nowrap;
    font: 800 24px/1 var(--display);
    letter-spacing: -.01em;
    text-transform: uppercase;
  }
  .brand-name span + span::before { content: " "; }

  .primary-nav { display: flex; align-items: stretch; }
  .primary-nav a {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 20px;
    border-right: 1px solid var(--rule-dark);
    color: var(--ink);
    text-decoration: none;
    font: 750 15px/1 var(--display);
    letter-spacing: .04em;
    text-transform: uppercase;
    transition: background 150ms ease-out, color 150ms ease-out;
  }
  .primary-nav a:hover { background: var(--sheet-2); }
  .primary-nav a[aria-current="page"] {
    background: var(--signal-fill);
    color: #fff;
  }
  .primary-nav a[aria-current="page"]::after {
    content: "";
    position: absolute;
    right: -1px;
    top: -1px;
    border-top: 10px solid var(--paper);
    border-left: 10px solid transparent;
  }
  .nav-count {
    min-width: 20px;
    padding: 3px 5px;
    border: 1px solid currentColor;
    font: 700 10px/1 var(--mono);
    text-align: center;
  }

  .header-state {
    margin-left: auto;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 var(--gutter);
  }
  .state-dot {
    width: 10px;
    height: 10px;
    flex: none;
    border-radius: 50%;
    background: var(--ink-faint);
  }
  .state-dot.ok { background: var(--healthy); }
  .state-dot.fail { background: var(--danger); }
  .state-dot.active { background: var(--signal); animation: breathe 1.6s ease-in-out infinite; }
  .header-state-copy {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
  }
  .header-state-copy strong { font-weight: 700; }
  .header-state-copy span {
    margin-left: 8px;
    color: var(--ink-soft);
    font: 11px/1.3 var(--mono);
  }

  main {
    width: min(100%, var(--max));
    min-height: calc(100dvh - var(--header-h) - 1px);
    margin: 0 auto;
    background-color: var(--sheet);
    background-image: var(--sheet-wash);
    background-size: auto, 512px 512px;
    border-inline: 1px solid var(--rule-dark);
  }

  /* Page heads: one line of title + facts, optional one-line copy. */
  .page-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px var(--s4);
    padding: var(--s6) var(--gutter) var(--s4);
    border-bottom: 1px solid var(--ink);
  }
  .page-head h1 {
    margin: 0;
    font: 800 26px/1 var(--display);
    letter-spacing: -.01em;
    text-transform: uppercase;
  }
  .page-meta {
    margin: 0;
    color: var(--ink-soft);
    font: 700 12px/1.3 var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .page-actions { margin-left: auto; }
  .page-copy {
    flex-basis: 100%;
    max-width: 72ch;
    margin: 2px 0 0;
    color: var(--ink-soft);
    font-size: 13px;
    text-wrap: pretty;
  }

  /* Now: the status strip answers the five questions in one row. */
  .status-strip {
    display: grid;
    grid-template-columns: minmax(280px, 2fr) repeat(4, minmax(0, 1fr));
    border-bottom: 1px solid var(--ink);
  }
  .status-strip > * {
    min-width: 0;
    padding: var(--s4);
    border-left: 1px solid var(--rule-dark);
  }
  .status-strip > :first-child { padding-inline: var(--gutter); border-left: 0; }
  .verdict h1 {
    margin: 0;
    font: 800 26px/1 var(--display);
    letter-spacing: -.01em;
    text-wrap: balance;
  }
  .verdict.is-attention h1 { color: var(--signal-dark); }
  .verdict p { margin: 6px 0 0; color: var(--ink-soft); font-size: 13px; }
  .fact-label,
  .section-note,
  label,
  .field-label {
    color: var(--ink-soft);
    font: 700 10px/1.2 var(--mono);
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .fact-value {
    display: block;
    margin-top: 6px;
    font: 750 22px/1 var(--display);
    letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .fact-detail {
    display: block;
    margin-top: 5px;
    color: var(--ink-soft);
    font: 11px/1.35 var(--mono);
    text-wrap: pretty;
  }
  .status-good { color: var(--healthy); }
  .status-bad { color: var(--danger); }

  /* Sections: heading row, then rows. Rules separate, spacing groups. */
  .section {
    padding: var(--s4) var(--gutter) var(--s6);
    border-bottom: 1px solid var(--rule-dark);
  }
  .section-head,
  .sub-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 4px var(--s4);
    margin-bottom: var(--s3);
  }
  .section-head h2 {
    margin: 0;
    font: 750 16px/1 var(--display);
    letter-spacing: .03em;
    text-transform: uppercase;
  }
  .sub-head { margin-top: var(--s4); }
  .sub-head h3 {
    margin: 0;
    font: 750 13px/1 var(--display);
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .section-note {
    text-transform: none;
    letter-spacing: 0;
    font: 11px/1.4 var(--mono);
  }
  .section-copy { max-width: 70ch; margin: 0 0 var(--s3); color: var(--ink-soft); font-size: 13px; text-wrap: pretty; }

  .attention-block { border-top: 3px solid var(--signal); }
  .attention-block h2 { color: var(--signal-dark); }
  .attention-list { border-top: 1px solid var(--rule-dark); }
  .attention-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: var(--s4);
    min-height: 44px;
    padding: 6px 0;
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
    text-decoration: none;
  }
  .attention-row:hover .row-main strong { text-decoration: underline; text-underline-offset: 3px; }
  .attention-row strong { display: block; font-size: 14px; }
  .chevron {
    width: 9px;
    height: 9px;
    margin-right: 6px;
    border-right: 2px solid var(--link);
    border-bottom: 2px solid var(--link);
    transform: rotate(-45deg);
  }

  .register-list { border-top: 1px solid var(--rule-dark); }
  .register-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: var(--s4);
    min-height: 44px;
    padding: 6px 0;
    border-bottom: 1px solid var(--rule);
  }
  button.register-row {
    width: 100%;
    cursor: pointer;
    background: transparent;
    border-inline: 0;
    border-top: 0;
    text-align: left;
    transition: background 150ms ease-out;
  }
  button.register-row:hover { background: var(--sheet-2); }
  .row-main { min-width: 0; }
  .row-title {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font: 700 13px/1.3 var(--mono);
  }
  .row-detail { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 12px; }
  .row-value { font: 800 18px/1 var(--display); font-variant-numeric: tabular-nums; }
  .row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
  .dup-flag {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 5px;
    border: 1px solid var(--healthy);
    color: var(--healthy);
    font: 700 10px/1.3 var(--mono);
    letter-spacing: .06em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .prune-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s3);
    flex-wrap: wrap;
    margin: 0 0 var(--s3);
    padding: 8px 12px;
    border: 1px dashed var(--rule-dark);
    background-color: var(--sheet-2);
    color: var(--ink-soft);
    font-size: 12px;
  }

  /* Proof grid: the photos themselves are the evidence; the image is the target. */
  .proof-grid,
  .library-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
  }
  .proof { min-width: 0; margin: 0; background: var(--sheet); }
  .proof-media {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    padding: 0;
    border: 0;
    overflow: hidden;
    background: var(--sheet-2);
  }
  button.proof-media { cursor: pointer; }
  .proof-media img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform 240ms cubic-bezier(.16, 1, .3, 1);
  }
  button.proof-media:hover img { transform: scale(1.02); }
  .media-placeholder {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    padding: 12px;
    color: var(--ink-soft);
    font: 700 11px/1.3 var(--mono);
    letter-spacing: .08em;
    text-align: center;
    text-transform: uppercase;
  }
  .proof figcaption { padding: 8px 10px 10px; }
  .file-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font: 700 12px/1.3 var(--mono);
  }
  .file-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 8px;
    margin-top: 3px;
    color: var(--ink-soft);
    font: 11px/1.4 var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .file-destination { color: var(--link); font-weight: 700; text-align: left; }

  /* Protection copy folds away: read once, then out of the way. */
  details.protection { border-bottom: 1px solid var(--rule-dark); }
  details.protection > summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s4);
    min-height: 44px;
    padding: 0 var(--gutter);
    cursor: pointer;
    list-style: none;
    color: var(--ink-soft);
    font: 750 13px/1 var(--display);
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  details.protection > summary::-webkit-details-marker,
  details.advanced > summary::-webkit-details-marker { display: none; }
  details.protection > summary::after,
  details.advanced > summary::after {
    content: "";
    width: 8px;
    height: 8px;
    margin: -4px 4px 0 0;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
    transition: transform 180ms ease-out;
  }
  details.protection[open] > summary::after,
  details.advanced[open] > summary::after { transform: translateY(4px) rotate(-135deg); }
  .protection-list {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--s4) var(--s6);
    padding: 0 var(--gutter) var(--s6);
  }
  .protection-list h3 { margin: 0; font: 750 14px/1.2 var(--display); text-transform: uppercase; }
  .protection-list p { margin: 4px 0 0; color: var(--ink-soft); font-size: 12px; }

  .empty-state {
    padding: var(--s6);
    background: var(--sheet-2);
    border: 1px solid var(--rule-dark);
  }
  .empty-state h2 { margin: 0; font: 800 22px/1 var(--display); text-transform: uppercase; }
  .empty-state > p { max-width: 64ch; margin: 8px 0 0; color: var(--ink-soft); font-size: 13px; }
  .setup-steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--s6);
    margin-top: var(--s4);
    padding-top: var(--s4);
    border-top: 1px solid var(--rule-dark);
  }
  .setup-steps strong { display: block; font: 750 14px/1.2 var(--display); text-transform: uppercase; }
  .setup-steps p { margin: 4px 0 0; color: var(--ink-soft); font-size: 12px; }

  .text-link,
  .link-button {
    appearance: none;
    padding: 0;
    border: 0;
    background: none;
    color: var(--link);
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .text-link:hover, .link-button:hover { color: #0e318c; }

  .button {
    appearance: none;
    min-height: 32px;
    padding: 6px 12px;
    border: 1px solid var(--ink);
    border-radius: 2px;
    background: var(--ink);
    color: var(--sheet);
    cursor: pointer;
    font: 750 12px/1 var(--display);
    letter-spacing: .05em;
    text-transform: uppercase;
    transition: background 150ms ease-out, color 150ms ease-out, border-color 150ms ease-out;
  }
  .button:hover { background: var(--signal-fill); border-color: var(--signal-fill); }
  .button:active { transform: translateY(1px); }
  .button.secondary { background: transparent; color: var(--ink); }
  .button.secondary:hover { background: var(--sheet-2); border-color: var(--ink); }
  .button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .button.danger:hover { background: var(--danger); color: #fff; }
  .button.quiet { padding: 6px 8px; border-color: transparent; background: transparent; color: var(--link); }
  .button.quiet:hover { background: var(--sheet-2); border-color: var(--rule-dark); color: var(--ink); }
  .button:disabled { cursor: wait; opacity: .48; }

  .notice {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 8px;
    margin-bottom: var(--s3);
    padding: 10px 12px;
    border: 1px solid var(--warning);
    background: #f4e3cc;
    color: #502700;
    font-size: 13px;
  }
  .notice.danger { border-color: var(--danger); background: #f1d8d1; color: #54251f; }
  .notice p { margin: 0; }

  .issue-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: var(--s4);
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
  }
  .decision-row { grid-template-columns: 96px minmax(0, 1fr); align-items: start; }
  .decision-thumb { width: 96px; aspect-ratio: 4 / 3; object-fit: cover; background: var(--sheet-2); }
  .decision-options { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

  .switch-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: var(--s4);
    align-items: center;
    min-height: 52px;
    padding: 6px 0;
    border-bottom: 1px solid var(--rule);
  }
  .switch-row strong { display: block; font-size: 14px; }
  .switch-row p { max-width: 70ch; margin: 2px 0 0; color: var(--ink-soft); font-size: 12px; }
  .switch {
    appearance: none;
    position: relative;
    width: 48px;
    height: 44px;
    flex: none;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
  }
  .switch::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 9px;
    height: 26px;
    border: 1px solid var(--ink);
    background: var(--sheet-2);
    transition: background 150ms ease-out, border-color 150ms ease-out;
  }
  .switch::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 13px;
    width: 18px;
    height: 18px;
    background: var(--ink);
    transition: transform 180ms cubic-bezier(.16, 1, .3, 1), background 150ms ease-out;
  }
  .switch[aria-checked="true"]::before { background: #f4d3cc; border-color: var(--signal); }
  .switch[aria-checked="true"]::after { transform: translateX(22px); background: var(--signal); }
  .switch:disabled { cursor: wait; opacity: .5; }

  .inline-form { display: flex; align-items: flex-end; gap: var(--s2); margin-top: var(--s3); }
  .field { min-width: 0; }
  .field.grow { flex: 1; }
  label, .field-label { display: block; margin-bottom: 4px; letter-spacing: .07em; }
  input[type="text"],
  input[type="search"],
  input[type="number"],
  select {
    width: 100%;
    min-height: 36px;
    padding: 6px 10px;
    border: 1px solid var(--rule-dark);
    border-radius: 2px;
    background: var(--sheet);
    color: var(--ink);
    font: 13px/1.3 var(--mono);
  }
  input::placeholder { color: var(--ink-faint); opacity: 1; }
  input:focus, select:focus { border-color: var(--focus); outline: 3px solid color-mix(in srgb, var(--focus) 25%, transparent); }

  details.advanced { margin-top: var(--s4); border-top: 1px solid var(--rule-dark); }
  details.advanced > summary {
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s4);
    cursor: pointer;
    list-style: none;
    font: 750 16px/1 var(--display);
    letter-spacing: .03em;
    text-transform: uppercase;
  }
  .advanced-body { padding: 0 0 var(--s4); }

  .rule-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: var(--s3);
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
  }
  .rule-code { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font: 12px/1.45 var(--mono); }
  .rule-muted { color: var(--ink-soft); }
  .rule-arrow { color: var(--signal); font-weight: 800; }
  .rule-form {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr);
    gap: 10px 16px;
    align-items: start;
    margin-top: var(--s3);
    padding: var(--s4);
    background: var(--sheet-2);
    border: 1px solid var(--rule-dark);
  }
  .rule-form .field-label { margin-top: 8px; }
  .rule-form .field-label:first-child { margin-top: 0; }
  .field-help { display: block; margin-top: 3px; color: var(--ink-faint); font: 11px/1.35 var(--sans); text-transform: none; letter-spacing: 0; }
  .form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 6px; padding-top: 4px; }
  .picker {
    min-height: 36px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 4px;
    border: 1px solid var(--rule-dark);
    background: var(--sheet);
  }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 8px; border: 1px solid var(--rule-dark); font: 11px/1 var(--mono); }
  .chip button { appearance: none; padding: 0; border: 0; background: none; color: var(--danger); cursor: pointer; font-weight: 800; }
  .picker select { width: auto; min-height: 28px; padding: 3px 28px 3px 7px; border-style: dashed; font-size: 11px; }
  .picker input { width: min(210px, 100%); min-height: 28px; padding: 4px 7px; }
  .probe-result { min-height: 20px; margin-top: 8px; color: var(--ink-soft); font: 12px/1.4 var(--mono); }

  .skeleton {
    display: grid;
    align-content: start;
    gap: var(--s3);
    padding: var(--s6) var(--gutter);
  }
  .skeleton-line { height: 14px; max-width: 480px; background: var(--sheet-2); animation: skeleton 1.2s ease-in-out infinite alternate; }
  .skeleton-line.title { width: min(420px, 70%); height: 26px; }
  .skeleton-block { height: 200px; margin-top: var(--s3); border: 1px solid var(--rule); background: var(--paper); animation: skeleton 1.2s ease-in-out infinite alternate; }
  .route-error { min-height: calc(100dvh - var(--header-h) - 1px); display: grid; place-items: center; padding: 40px 20px; }
  .route-error > div { width: min(520px, 100%); padding: var(--s6); border: 1px solid var(--danger); background: #f1d8d1; }
  .route-error h1 { margin: 0; font: 800 26px/1 var(--display); text-transform: uppercase; }
  .route-error p { margin: 10px 0 18px; color: #54251f; }

  #toast {
    position: fixed;
    z-index: 60;
    right: 16px;
    bottom: 16px;
    width: min(420px, calc(100vw - 32px));
    padding: 11px 14px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--sheet);
    font: 12px/1.4 var(--mono);
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
    transition: opacity 180ms ease-out, transform 220ms cubic-bezier(.16, 1, .3, 1);
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.bad { border-color: var(--danger); background: var(--danger); color: #fff; }
  .visually-hidden {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }

  @keyframes breathe { 50% { transform: scale(.72); opacity: .55; } }
  @keyframes skeleton { to { opacity: .52; } }

  @media (max-width: 1099px) {
    .brand-name { font-size: 20px; }
    .primary-nav a { padding-inline: 14px; }
    .header-state-copy span { display: none; }
    .status-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .status-strip > :first-child { grid-column: 1 / -1; border-bottom: 1px solid var(--rule-dark); }
    .status-strip > :nth-child(2) { border-left: 0; }
    .proof-grid, .library-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .protection-list { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 760px) {
    :root { --header-h: 52px; }
    body { padding-bottom: 60px; }
    .brand { padding-inline: var(--s4); border-right: 0; }
    .brand-name { font-size: 20px; }
    .primary-nav {
      position: fixed;
      z-index: 40;
      left: 0;
      right: 0;
      bottom: 0;
      height: 60px;
      background: var(--sheet);
      border-top: 1px solid var(--ink);
    }
    .primary-nav a {
      min-width: 0;
      flex: 1;
      justify-content: center;
      padding: 0 4px;
      font-size: 13px;
    }
    .primary-nav a:last-child { border-right: 0; }
    .header-state { padding-inline: var(--s4); }
    main { min-height: calc(100dvh - var(--header-h) - 61px); border-inline: 0; }
    .page-head { padding: var(--s4) var(--s4) var(--s3); }
    .status-strip { grid-template-columns: 1fr 1fr; }
    .status-strip > * { padding: var(--s3) var(--s4); }
    .status-strip > :nth-child(2n) { border-left: 0; }
    .status-strip > :nth-child(n + 4) { border-top: 1px solid var(--rule-dark); }
    .verdict h1 { font-size: 24px; }
    .fact-value { font-size: 20px; }
    .section { padding: var(--s3) var(--s4) var(--s4); }
    .proof-grid, .library-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .proof figcaption { padding: 6px 8px 8px; }
    .file-name { font-size: 11px; }
    .file-meta { font-size: 10px; }
    details.protection > summary { padding-inline: var(--s4); }
    .protection-list { grid-template-columns: 1fr; padding-inline: var(--s4); }
    .setup-steps { grid-template-columns: 1fr; gap: var(--s4); }
    .decision-row { grid-template-columns: 72px minmax(0, 1fr); }
    .decision-thumb { width: 72px; }
    .rule-form { grid-template-columns: 1fr; padding: var(--s3); }
    .rule-form .field-label { margin-top: 0; margin-bottom: -6px; }
    .form-actions { grid-column: 1; }
    .inline-form { align-items: stretch; flex-direction: column; }
    .button { min-height: 44px; }
    .button.quiet { min-width: 44px; }
    input[type="text"], input[type="search"], input[type="number"], select { min-height: 44px; }
    .picker select, .picker input { min-height: 40px; }
    .chip { gap: 6px; padding: 0 0 0 8px; }
    .chip button { display: grid; place-items: center; min-width: 40px; min-height: 40px; }
    .text-link { display: inline-flex; align-items: center; min-height: 44px; }
    #toast { bottom: 76px; }
  }

  @media (max-width: 440px) {
    .header-state-copy { display: none; }
    .primary-nav a { font-size: 11px; }
    .nav-count { position: absolute; top: 6px; right: 6px; }
    .issue-row, .rule-row { grid-template-columns: 1fr; align-items: start; }
    .row-actions { justify-content: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<!--
THESIS: A five-second confidence instrument for irreplaceable files, refusing both the black camera-body dashboard and rounded cloud-storage SaaS.
OWN-WORLD: Cool archival paper, near-black register ink, ruled accession sheets, clipped index tabs, tabular metadata, and one vermilion intake thread.
STORY: The operator sees whether files are arriving, understands the wait-check-file mechanism, resolves exceptions, then browses or tunes the workflow.
FIRST VIEWPORT: A 56px index bar, then a status strip that answers the five questions in one row, anything that needs a decision, and real recent photos six across; the protection copy folds away after the first read.
FORM: Contemporary archive accession ledger, fourth grounded direction, seed 09d695ef; composition approved from .impeccable/mocks/archive-manifest-c.png.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<a class="skip-link" href="#view">Skip to content</a>
<header class="app-header">
  <div class="header-inner">
    <a class="brand" href="#now" aria-label="Camera Dropbox, Now">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name"><span>Camera</span><span>Dropbox</span></span>
    </a>
    <nav class="primary-nav" id="tabs" aria-label="Primary navigation"></nav>
    <div class="header-state" id="header-state" role="status" aria-live="polite">
      <span class="state-dot" aria-hidden="true"></span>
      <span class="header-state-copy"><strong>Checking panel</strong><span>Reading local state</span></span>
    </div>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

const $ = (selector, root = document) => root.querySelector(selector);
const view = $("#view");
const TABS = [
  ["now", "Now"],
  ["library", "Library"],
  ["attention", "Attention"],
  ["automations", "Automations"],
];
const ROUTE_ALIASES = {
  overview: "now",
  folders: "library",
  quarantine: "attention",
  decisions: "attention",
  switches: "automations",
  rules: "automations",
};
const THUMB_V = 3;
let rawRoute = location.hash.slice(1) || "now";
let tab = normalizeRoute(rawRoute);
let attentionCount = 0;
let config = null;
let pollTimer = null;
let CAMERAS = [];
const pickers = {};

function normalizeRoute(route) {
  const normalized = ROUTE_ALIASES[route] || route;
  return TABS.some(([id]) => id === normalized) ? normalized : "now";
}

async function api(path, options) {
  const response = await fetch(path, options);
  const isJson = (response.headers.get("content-type") || "").includes("json");
  const body = isJson ? await response.json() : null;
  if (!response.ok) throw new Error((body && body.error) || `Request failed (${response.status})`);
  return body;
}

const esc = value => String(value).replace(/[&<>"']/g, character => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
})[character]);

function bytes(value) {
  if (value == null) return "—";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let unit = 0;
  let number = Number(value);
  while (number >= 1024 && unit < units.length - 1) { number /= 1024; unit += 1; }
  return `${number.toFixed(number >= 100 || unit === 0 ? 0 : 1)} ${units[unit]}`;
}

function age(seconds) {
  if (seconds < 90) return `${seconds}s`;
  if (seconds < 5400) return `${Math.round(seconds / 60)}m`;
  if (seconds < 129600) return `${Math.round(seconds / 3600)}h`;
  return `${Math.round(seconds / 86400)}d`;
}

const hm = timestamp => new Date(timestamp * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const plural = (count, one, many = `${one}s`) => count === 1 ? one : many;

function longDate(date) {
  try {
    return new Date(`${date}T12:00:00`).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  } catch (_) {
    return date;
  }
}

function toast(message, bad = false) {
  const element = $("#toast");
  element.textContent = message;
  element.classList.toggle("bad", bad);
  element.classList.add("show");
  clearTimeout(element._hide);
  element._hide = setTimeout(() => element.classList.remove("show"), 3200);
}

function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([id, label]) => {
    const badge = id === "attention" && attentionCount > 0
      ? `<span class="nav-count" aria-label="${attentionCount} items">${attentionCount > 99 ? "99+" : attentionCount}</span>`
      : "";
    return `<a href="#${id}" ${id === tab ? 'aria-current="page"' : ""}>${label}${badge}</a>`;
  }).join("");
}

function activeQuarantine(files) {
  return files.filter(file => !file.rel.startsWith("_trash/"));
}

function updateChrome(status, quarantineFiles = []) {
  const inbound = status.receiving + status.incoming.length;
  const issues = activeQuarantine(quarantineFiles).length + status.counts.pending_decisions + (status.health.state === "fail" ? 1 : 0);
  attentionCount = issues;
  renderTabs();

  let stateClass = "ok";
  let title = "Monitoring intake";
  let detail = status.health.detail || "No failures reported";
  if (status.health.state === "fail") {
    stateClass = "fail";
    title = "Pipeline needs attention";
  } else if (inbound > 0) {
    stateClass = "active";
    title = `${inbound} ${plural(inbound, "file")} arriving`;
    detail = `${status.receiving} receiving · ${status.incoming.length} waiting or checking`;
  } else if (issues > 0) {
    stateClass = "fail";
    title = `${issues} ${plural(issues, "item")} need attention`;
  }
  $("#header-state").setAttribute("aria-label", `${title}. ${detail}`);
  $("#header-state").innerHTML = `<span class="state-dot ${stateClass}" aria-hidden="true"></span>
    <span class="header-state-copy"><strong>${esc(title)}</strong><span>${esc(detail)}</span></span>`;
}

async function refreshChrome() {
  if (document.hidden) return;
  try {
    const [status, quarantine] = await Promise.all([api("/api/status"), api("/api/quarantine")]);
    updateChrome(status, quarantine.files);
  } catch (_) {
    $("#header-state").setAttribute("aria-label", "Panel unavailable. Could not read local state.");
    $("#header-state").innerHTML = `<span class="state-dot fail" aria-hidden="true"></span>
      <span class="header-state-copy"><strong>Panel unavailable</strong><span>Could not read local state</span></span>`;
  }
}

let skeletonTimer = null;
function loadingPage() {
  view.innerHTML = `<div class="skeleton" aria-label="Loading">
    <div class="skeleton-line title"></div><div class="skeleton-line"></div><div class="skeleton-line"></div>
    <div class="skeleton-block"></div></div>`;
}

// Doherty threshold: LAN fetches usually land well under 200 ms. The skeleton
// only appears when a fetch is actually slow, so a tab switch feels immediate.
function deferSkeleton() {
  clearTimeout(skeletonTimer);
  skeletonTimer = setTimeout(loadingPage, 200);
  return () => clearTimeout(skeletonTimer);
}

function routeError(error) {
  view.innerHTML = `<section class="route-error"><div>
    <h1>Couldn’t load this view</h1>
    <p>${esc(error.message)}</p>
    <button class="button" type="button" data-action="retry-route">Try again</button>
  </div></section>`;
}

function pageHead(title, meta = "", copy = "", actions = "") {
  return `<header class="page-head"><h1>${esc(title)}</h1>${meta ? `<p class="page-meta">${meta}</p>` : ""}${actions ? `<div class="page-actions">${actions}</div>` : ""}${copy ? `<p class="page-copy">${copy}</p>` : ""}</header>`;
}

function sectionBlock(id, title, note, body, className = "") {
  return `<section class="section ${className}" aria-labelledby="${id}"><div class="section-head"><h2 id="${id}">${esc(title)}</h2>${note ? `<span class="section-note">${note}</span>` : ""}</div>${body}</section>`;
}

function firstRun() {
  const host = location.hostname || "this server";
  return `<div class="empty-state">
    <h2>Ready for your first camera</h2>
    <p>Add this box to your camera’s FTP settings, take one frame, and watch it move from intake to the date-sorted library.</p>
    <div class="setup-steps">
      <article><strong>Use FTP</strong><p>Server <span class="row-title">${esc(host)}</span>, port <span class="row-title">21</span>, passive mode. Use the credentials configured on this box.</p></article>
      <article><strong>Turn security off</strong><p>Select FTP—not SFTP or FTPS—and disable secure transfer in the camera menu.</p></article>
      <article><strong>Send one frame</strong><p>Keep the camera connected while the file settles. Accepted files appear here after structural checks finish.</p></article>
    </div>
  </div>`;
}

function canPreview(name) {
  return /\.(nef|arw|raf|dng|nrw|cr2|cr3|jpe?g|tiff?|hif|heif|heic)$/i.test(name);
}

function proofCard(file, options = {}) {
  const preview = canPreview(file.name)
    ? `<img class="preview-image" loading="lazy" src="/api/thumb?v=${THUMB_V}&amp;f=${encodeURIComponent(file.rel)}" alt="Preview of ${esc(file.name)}" data-placeholder="No preview">`
    : `<div class="media-placeholder">${esc((file.type || "file").toUpperCase())}</div>`;
  const openDay = options.destination !== false;
  const media = openDay
    ? `<button class="proof-media" type="button" data-day="${esc(file.date)}" aria-label="Open ${esc(file.date)} / ${esc(file.type)} in the library">${preview}</button>`
    : `<div class="proof-media">${preview}</div>`;
  const destination = openDay ? `<button class="link-button file-destination" type="button" data-day="${esc(file.date)}">${esc(file.date)}</button>` : "";
  return `<figure class="proof">${media}<figcaption>
    <div class="file-name" title="${esc(file.name)}">${esc(file.name)}</div>
    <div class="file-meta"><span>${esc((file.type || "file").toUpperCase())}</span><span>${hm(file.mtime)}</span>${destination}</div>
  </figcaption></figure>`;
}

function attentionBlock(status, quarantineFiles) {
  const quarantine = activeQuarantine(quarantineFiles);
  const decisions = status.counts.pending_decisions;
  const items = [];
  if (status.health.state === "fail") items.push(["Pipeline alert", status.health.detail || "The health check reported a problem."]);
  if (quarantine.length) items.push([`${quarantine.length} ${plural(quarantine.length, "file")} held`, "Retry validation or stage for deletion. Nothing is deleted automatically."]);
  if (decisions) items.push([`${decisions} lens ${plural(decisions, "decision")}`, "Answer, or leave the metadata unchanged."]);
  if (!items.length) return "";
  const rows = items.map(([title, detail]) => `<a class="attention-row" href="#attention"><span class="row-main"><strong>${esc(title)}</strong><span class="row-detail">${esc(detail)}</span></span><span class="chevron" aria-hidden="true"></span></a>`).join("");
  return sectionBlock("attention-title", "Needs attention", "", `<div class="attention-list">${rows}</div>`, "attention-block");
}

async function renderNow({ loading = true } = {}) {
  const settle = loading ? deferSkeleton() : () => {};
  let status, recent, quarantine;
  try {
    [status, recent, quarantine] = await Promise.all([
      api("/api/status"), api("/api/recent?limit=12"), api("/api/quarantine"),
    ]);
  } finally {
    settle();
  }
  if (tab !== "now") return;
  updateChrome(status, quarantine.files);

  const inbound = status.receiving + status.incoming.length;
  const quarantineOpen = activeQuarantine(quarantine.files).length;
  const issueCount = quarantineOpen + status.counts.pending_decisions + (status.health.state === "fail" ? 1 : 0);
  let title = "Ready for your next upload";
  let sub = "Nothing in intake. Nothing held.";
  let verdictClass = "";
  if (status.health.state === "fail") {
    title = "The pipeline needs attention";
    sub = "Files stay in place. Review the health report below.";
    verdictClass = "is-attention";
  } else if (inbound > 0) {
    title = `${inbound} ${plural(inbound, "file")} ${inbound === 1 ? "is" : "are"} arriving`;
    sub = "Leave the camera connected until intake clears.";
  } else if (issueCount > 0) {
    title = `${issueCount} ${plural(issueCount, "item")} ${issueCount === 1 ? "needs" : "need"} attention`;
    sub = "Accepted files are already filed. Review the held items below.";
    verdictClass = "is-attention";
  }

  const freePercent = status.disk.total ? Math.round(status.disk.free / status.disk.total * 100) : 0;
  const healthBad = status.health.state === "fail";
  const healthDetail = status.health.detail || "No failures reported";
  const recentFiles = recent.files.slice(0, 12);
  const recentMarkup = recentFiles.length
    ? `<div class="proof-grid">${recentFiles.map(file => proofCard(file)).join("")}</div>`
    : firstRun();
  const intakeRows = status.incoming.length
    ? `<div class="register-list">${status.incoming.map(file => `<div class="register-row"><div class="row-main"><div class="row-title">${esc(file.name)}</div><div class="row-detail">Waiting or checking · arrived ${age(file.age_s)} ago</div></div><span class="row-value">${bytes(file.size)}</span></div>`).join("")}</div>`
    : '<p class="section-copy">Files still being written appear here once the camera finishes each transfer.</p>';
  const intake = inbound
    ? sectionBlock("intake-title", "In intake", `${status.receiving} still writing · ${status.incoming.length} waiting or checking`, intakeRows)
    : "";
  const protectionOpen = $("#protection")?.open ? " open" : "";

  view.innerHTML = `<div class="page">
    <section class="status-strip" aria-labelledby="now-verdict">
      <div class="verdict ${verdictClass}"><h1 id="now-verdict">${esc(title)}</h1><p>${esc(sub)}</p></div>
      <div class="fact"><span class="fact-label">Pipeline</span><strong class="fact-value ${healthBad ? "status-bad" : "status-good"}">${healthBad ? "Attention" : "Monitoring"}</strong><span class="fact-detail" title="${esc(healthDetail)}">${esc(healthDetail)}</span></div>
      <div class="fact"><span class="fact-label">In intake</span><strong class="fact-value">${inbound}</strong><span class="fact-detail">${status.receiving} receiving · ${status.incoming.length} checking</span></div>
      <div class="fact"><span class="fact-label">Filed today</span><strong class="fact-value">${status.counts.sorted_today}</strong><span class="fact-detail">by capture date, not arrival</span></div>
      <div class="fact"><span class="fact-label">Free space</span><strong class="fact-value">${bytes(status.disk.free)}</strong><span class="fact-detail">${freePercent}% of ${bytes(status.disk.total)}</span></div>
    </section>
    ${intake}
    ${attentionBlock(status, quarantine.files)}
    ${sectionBlock("recent-title", "Recently accepted", recent.files.length ? '<a class="text-link" href="#library">Open library</a>' : "", recentMarkup)}
    <details class="protection" id="protection"${protectionOpen}>
      <summary>How files are protected</summary>
      <div class="protection-list">
        <div><h3>Waits for stability</h3><p>Fresh uploads must stop changing before the sorter moves on.</p></div>
        <div><h3>Checks file structure</h3><p>RAW, image, HEIF, and video payloads get format-specific integrity checks.</p></div>
        <div><h3>Never overwrites</h3><p>Name collisions create a suffixed copy. The existing file stays untouched.</p></div>
        <div><h3>Files by capture date</h3><p>Accepted media lands under its recorded photo date and file type.</p></div>
      </div>
    </details>
  </div>`;
}

async function renderLibrary() {
  const settle = deferSkeleton();
  let library;
  try {
    library = await api("/api/library");
  } finally {
    settle();
  }
  if (tab !== "library") return;
  const fileTotal = library.days.reduce((sum, day) => sum + day.total, 0);
  const meta = `${library.days.length} capture ${plural(library.days.length, "date")} · ${fileTotal} ${plural(fileTotal, "file")} · newest first`;
  const body = library.days.length
    ? `<div class="register-list">${library.days.map(day => {
        const types = Object.entries(day.types).map(([type, count]) => `${esc(type)} ${count}`).join(" · ") || "No supported files";
        return `<button class="register-row" type="button" data-day="${esc(day.date)}">
          <span class="row-main"><span class="row-title">${esc(longDate(day.date))}</span><span class="row-detail">${types}</span></span>
          <span class="row-value">${day.total}</span>
        </button>`;
      }).join("")}</div>`
    : firstRun();
  view.innerHTML = `<div class="page">${pageHead("Library", meta, "Grouped by the capture date the camera recorded, not the day of arrival.")}
    <section class="section">${body}</section>
  </div>`;
}

async function renderDay(date) {
  const settle = deferSkeleton();
  let day;
  try {
    day = await api(`/api/library/${encodeURIComponent(date)}`);
  } finally {
    settle();
  }
  if (tab !== "library") return;
  const files = day.files.map(file => ({ ...file, date }));
  const typeCount = new Set(files.map(file => file.type)).size;
  const meta = `${esc(date)} · ${files.length} ${plural(files.length, "file")} · ${typeCount} media ${plural(typeCount, "group")}`;
  const back = '<button class="button secondary" type="button" data-action="back-library">Back to dates</button>';
  view.innerHTML = `<div class="page">${pageHead(longDate(date), meta, "", back)}
    <section class="section">
      ${files.length ? `<div class="library-grid">${files.map(file => proofCard(file, { destination: false })).join("")}</div>` : '<div class="empty-state"><h2>This date is empty</h2><p>No supported media files are currently visible in this folder.</p></div>'}
    </section>
  </div>`;
}

function quarantineRows(files) {
  if (!files.length) return '<p class="section-copy">No active quarantine files. Nothing is waiting for a retry or deletion decision.</p>';
  return `<div class="register-list">${files.map(file => `<div class="issue-row">
    <div class="row-main"><div class="row-title">${esc(file.rel)}${file.in_library ? '<span class="dup-flag">Same name+size filed</span>' : ""}</div><div class="row-detail">${bytes(file.size)} · held ${age(Math.max(0, Math.round(Date.now() / 1000 - file.mtime)))} ago · ${file.in_library ? "a same-size copy is filed; prune compares bytes before deleting" : "no copy found in the library"}</div></div>
    <div class="row-actions">
      <button class="button secondary" type="button" data-quarantine="retry" data-rel="${esc(file.rel)}">Retry validation</button>
      <button class="button danger" type="button" data-quarantine="trash" data-rel="${esc(file.rel)}" data-armed="0">Stage for deletion</button>
    </div>
  </div>`).join("")}</div>`;
}

function pruneBar(files) {
  const verified = files.filter(file => file.in_library).length;
  if (!verified) return "";
  return `<div class="prune-bar"><span>${verified} ${plural(verified, "file")} ${verified === 1 ? "has" : "have"} a same-name, same-size copy filed in the library.</span>
    <button class="button danger" type="button" data-quarantine="prune_verified" data-rel="" data-armed="0">Prune verified copies</button></div>`;
}

function decisionRows(pending, presets) {
  if (!pending.length) return '<p class="section-copy">No lens questions are open. Files with known or untouched lens metadata need no decision.</p>';
  return pending.map(question => `<div class="issue-row decision-row">
    <img class="decision-thumb preview-image" loading="lazy" src="/api/thumb?v=${THUMB_V}&amp;f=${encodeURIComponent(question.rel)}" alt="Preview of ${esc(question.rel)}" data-placeholder="No preview">
    <div class="row-main">
      <div class="row-title">${esc(question.rel)}</div>
      <div class="row-detail">${question.camera ? `${esc(question.camera)} · ` : ""}Lens ${esc(question.lens || "unknown")} · Lens ID ${esc(question.lensid || "unknown")}</div>
      <div class="decision-options">
        ${presets.map((preset, index) => `<button class="button secondary" type="button" data-decision="${esc(question.id)}" data-choice="${index}">${esc(preset.label)}</button>`).join("")}
        <button class="button quiet" type="button" data-decision="${esc(question.id)}" data-choice="skip">Leave metadata unchanged</button>
      </div>
    </div>
  </div>`).join("");
}

async function renderAttention() {
  const settle = deferSkeleton();
  let status, quarantine, decisions, cfg;
  try {
    [status, quarantine, decisions, cfg] = await Promise.all([
      api("/api/status"), api("/api/quarantine"), api("/api/decisions"), api("/api/config"),
    ]);
  } finally {
    settle();
  }
  if (tab !== "attention") return;
  config = cfg;
  const active = activeQuarantine(quarantine.files);
  const issueTotal = active.length + decisions.pending.length + (status.health.state === "fail" ? 1 : 0);
  updateChrome(status, quarantine.files);
  const meta = `${issueTotal} ${issueTotal === 1 ? "needs" : "need"} action · ${decisions.pending.length} pending ${plural(decisions.pending.length, "question")}`;
  const healthNotice = status.health.state === "fail"
    ? `<section class="section"><div class="notice danger"><strong>Pipeline health check reported a problem</strong><p>${esc(status.health.detail || "Review the host health check for details.")}</p></div></section>`
    : "";
  const clearState = issueTotal === 0
    ? '<section class="section"><p class="section-copy">Nothing needs you. Held transfers and lens questions appear here when a decision is useful.</p></section>'
    : "";
  const groups = [];
  if (active.length) groups.push(sectionBlock("held-title", "Held files", "Retry re-runs the intake checks · Stage moves the file under quarantine/_trash", pruneBar(active) + quarantineRows(active)));
  if (decisions.pending.length) groups.push(sectionBlock("decisions-title", "Lens decisions", "Identity metadata only · Leaving a question open changes nothing", decisionRows(decisions.pending, cfg.lens_presets || [])));
  if (decisions.resolved.length) {
    const resolved = `<div class="register-list">${decisions.resolved.map(item => `<div class="register-row"><div class="row-main"><div class="row-title">${esc(item.rel || "Unknown file")}</div><div class="row-detail">${esc(item.outcome || "Resolved")} · via ${esc(item.via || "panel")}</div></div></div>`).join("")}</div>`;
    groups.push(sectionBlock("answers-title", "Recent answers", "Answered here or through Telegram", resolved));
  }

  view.innerHTML = `<div class="page">${pageHead("Attention", meta, "Pipeline alerts, held files, and optional metadata questions. Nothing here deletes an original automatically.")}
    ${healthNotice}${clearState}${groups.join("")}
  </div>`;
}

const SWITCHES = {
  lens_massage: {
    label: "Apply lens metadata rules",
    description: "Rewrite identity tags for matching adapted lenses on new NEFs. Exposure values are never changed.",
  },
  nef_render_queue: {
    label: "Create recipe TIFF renders",
    description: "Send new NEFs to the configured render queue so the host workflow can place a recipe-look TIFF beside the raw.",
  },
  telegram_notifications: {
    label: "Send Telegram digests",
    description: "Send batched sort and quarantine summaries when Telegram credentials are mounted on the host.",
  },
  watch_funnel: {
    label: "Watch extra folders",
    description: "Move settled files from the folders below into the normal intake pipeline.",
  },
  ask_on_unknown: {
    label: "Ask about unknown lenses",
    description: "Create an Attention item for unmatched non-Nikkor glass. Unanswered questions close without changing the file.",
  },
};

function switchRow(key) {
  const item = SWITCHES[key];
  const on = config.features[key] !== false;
  return `<div class="switch-row"><div><strong>${esc(item.label)}</strong><p>${esc(item.description)}</p></div>

}

function watchedFoldersMarkup() {

  return `<div class="sub-head"><h3>Folder register</h3><span class="section-note">Paths must live under /data</span></div>
    ${folders.length ? `<div class="register-list">${folders.map((path, index) => `<div class="register-row"><div class="row-main"><div class="row-title">${esc(path)}</div><div class="row-detail">Settled files enter the same validation and sorting pipeline.</div></div><button class="button quiet" type="button" data-remove-folder="${index}">Stop watching</button></div>`).join("")}</div>` : '<p class="section-copy">No extra folders are registered. Camera uploads still arrive through incoming/.</p>'}
    <form class="inline-form" id="folder-form">

    </form>`;
}

function ruleRows() {
  const rules = config.lens_rules || [];

  return `<div class="register-list">${rules.map((rule, index) => {

      <span>${rule.match_lens.map(esc).join(" · ")}</span>

      ${rule.match_camera ? `<span class="rule-muted">on ${rule.match_camera.map(esc).join(", ")}</span>` : ""}

      <button class="button quiet" type="button" data-edit-rule="${index}">Edit</button>
      <button class="button quiet" type="button" data-delete-rule="${index}" data-armed="0">Delete</button>
    </div></div>`;
  }).join("")}</div>`;
}

function lensRulesMarkup(forceOpen) {

      <summary>Advanced lens rules</summary>
      <div class="advanced-body">
        <p class="section-copy">The first matching EXIF Lens signature wins. Camera filters narrow a rule to specific bodies; identity tags only, never exposure.</p>
        ${ruleRows()}
        <div class="row-actions"><button class="button" type="button" data-edit-rule="-1">Add lens rule</button></div>

          <div class="field"><label for="rule-camera">Camera body (optional)</label><input type="text" id="rule-camera" list="camera-list" placeholder="NIKON Z f" autocomplete="off"></div>

async function renderAutomations() {
  const settle = deferSkeleton();
  let cfg, cameras;
  try {
    [cfg, cameras] = await Promise.all([
      api("/api/config"), api("/api/cameras").catch(() => ({ cameras: [] })),
    ]);
  } finally {
    settle();
  }
  if (tab !== "automations") return;
  config = cfg;
  CAMERAS = cameras.cameras || [];
  const enabled = Object.values(config.features).filter(Boolean).length;
  const meta = `${enabled} of ${Object.keys(SWITCHES).length} enabled · ${config.lens_rules.length} lens ${plural(config.lens_rules.length, "rule")}`;
  const invalid = config._invalid ? `<section class="section"><div class="notice danger"><strong>The saved configuration could not be read</strong><p>Defaults are shown. The next successful change will replace the invalid file with a validated configuration.</p></div></section>` : "";
  const forceRules = rawRoute === "rules";

  view.innerHTML = `<div class="page">${pageHead("Automations", meta, "Changes apply to the next file without restarting intake. Switches store intent only: render queues and Telegram credentials live on the host and are not checked here.")}
    ${invalid}
    ${sectionBlock("intake-group", "File intake", "Bring files in from folders beyond the camera FTP inbox", switchRow("watch_funnel") + watchedFoldersMarkup())}
    ${sectionBlock("outputs-group", "Outputs", "Optional derivatives and low-noise phone summaries", switchRow("nef_render_queue") + switchRow("telegram_notifications"))}
    ${sectionBlock("lens-group", "Lens metadata", "Name adapted glass consistently without touching exposure values", switchRow("lens_massage") + switchRow("ask_on_unknown") + lensRulesMarkup(forceRules))}
  </div>`;
  if (forceRules) requestAnimationFrame(() => $("#lens-rules")?.scrollIntoView({ block: "start" }));
}

async function flipSwitch(key, button) {
  button.disabled = true;
  const next = !(config.features[key] !== false);
  try {
    config = await api("/api/config", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ features: { [key]: next } }),
    });
    button.setAttribute("aria-checked", String(config.features[key] !== false));
    toast(`${SWITCHES[key].label}: ${config.features[key] !== false ? "on" : "off"}`);
  } catch (error) {
    toast(error.message, true);
  } finally {
    button.disabled = false;
  }
}

async function addFolder(path) {
  if (config.watched_folders.includes(path)) {
    toast("That folder is already registered", true);
    return;
  }
  config = await api("/api/config", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ watched_folders: [...config.watched_folders, path] }),
  });
  toast(`Watching ${path}`);
  await renderAutomations();
}

async function removeFolder(index) {
  const removed = config.watched_folders[index];
  config = await api("/api/config", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ watched_folders: config.watched_folders.filter((_, itemIndex) => itemIndex !== index) }),
  });
  toast(`Stopped watching ${removed}`);
  await renderAutomations();
}

function renderPicker(id) {
  const box = $(`#${id}`);
  if (!box) return;
  const selected = pickers[id] || [];
  box.innerHTML = selected.map((camera, index) => `<span class="chip">${esc(camera)}<button type="button" data-unpick="${id}" data-index="${index}" aria-label="Remove ${esc(camera)}">×</button></span>`).join("") +
    `<select data-picker="${id}" aria-label="Add camera filter"><option value="">Add camera…</option>
      ${CAMERAS.filter(camera => !selected.includes(camera.name)).map(camera => `<option value="${esc(camera.name)}">${esc(camera.name)} · ${camera.count}</option>`).join("")}
      <option value="__custom__">Custom substring…</option></select>`;
}

function editRule(index) {
  const rule = index >= 0 ? config.lens_rules[index] : {};
  const form = $("#rule-form");
  form.innerHTML = `<form class="rule-form" id="lens-rule-form" data-rule-index="${index}">
    <label class="field-label" for="rule-match">Match Lens values<span class="field-help">Comma-separated exact EXIF Lens strings.</span></label><input type="text" id="rule-match" value="${esc((rule.match_lens || []).join(", "))}" placeholder="50mm f/1.2, 50mm f/1.3" required>
    <label class="field-label" for="rule-regex">Lens ID regular expression<span class="field-help">Optional POSIX ERE. \\d and (?:…) are not supported by the sorter.</span></label><input type="text" id="rule-regex" value="${esc(rule.match_lens_id_regex || "")}" placeholder="Leica.*35">
    <span class="field-label">Only these cameras<span class="field-help">Blank matches every body.</span></span><div class="picker" id="rule-include"></div>
    <span class="field-label">Never these cameras</span><div class="picker" id="rule-exclude"></div>
    <label class="field-label" for="rule-model">Set lens model</label><input type="text" id="rule-model" value="${esc(rule.lens_model || "")}" placeholder="FE 50mm F1.2 GM">
    <label class="field-label" for="rule-info">Set lens info</label><input type="text" id="rule-info" value="${esc(rule.lens_info || "")}" placeholder="50 50 1.2 1.2">
    <label class="field-label" for="rule-focal">Set focal length</label><input type="text" id="rule-focal" value="${esc(rule.set_focal_length || "")}" placeholder="35">
    <div class="form-actions"><button class="button secondary" type="button" data-action="cancel-rule">Cancel</button><button class="button" type="submit">Save rule</button></div>
  </form>`;
  pickers["rule-include"] = [...(rule.match_camera || [])];
  pickers["rule-exclude"] = [...(rule.exclude_camera || [])];
  renderPicker("rule-include");
  renderPicker("rule-exclude");
  $("#rule-match")?.focus();
}

function readRuleForm() {
  const rule = {};
  const match = $("#rule-match").value.split(",").map(value => value.trim()).filter(Boolean);
  if (match.length) rule.match_lens = match;
  const regex = $("#rule-regex").value.trim();
  if (regex) rule.match_lens_id_regex = regex;
  if ((pickers["rule-include"] || []).length) rule.match_camera = [...pickers["rule-include"]];
  if ((pickers["rule-exclude"] || []).length) rule.exclude_camera = [...pickers["rule-exclude"]];
  const model = $("#rule-model").value.trim();
  if (model) rule.lens_model = model;
  const info = $("#rule-info").value.trim();
  if (info) rule.lens_info = info;
  const focal = $("#rule-focal").value.trim();
  if (focal) rule.set_focal_length = focal;
  return rule;
}

async function saveRule(index) {
  const rules = [...config.lens_rules];
  const rule = readRuleForm();
  if (index >= 0) rules[index] = rule;
  else rules.push(rule);
  config = await api("/api/config", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ lens_rules: rules }),
  });
  toast(index >= 0 ? "Lens rule updated" : "Lens rule added");
  await renderAutomations();
}

async function deleteRule(index) {
  config = await api("/api/config", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ lens_rules: config.lens_rules.filter((_, ruleIndex) => ruleIndex !== index) }),
  });
  toast("Lens rule deleted");
  await renderAutomations();
}

function probeRule() {
  const result = $("#probe-result");
  if (!result || !config) return;
  const signature = $("#rule-probe")?.value.trim() || "";
  const camera = ($("#rule-camera")?.value || "").trim().toLowerCase();
  if (!signature) { result.textContent = ""; return; }
  const cameraMatches = rule =>
    (!rule.match_camera || rule.match_camera.some(value => camera.includes(value.toLowerCase()))) &&
    (!rule.exclude_camera || !rule.exclude_camera.some(value => camera.includes(value.toLowerCase())));
  const hit = config.lens_rules.find(rule => rule.match_lens.includes(signature) && cameraMatches(rule));
  const cameraExcluded = config.lens_rules.some(rule => rule.match_lens.includes(signature) && !cameraMatches(rule));
  result.textContent = hit
    ? `Matches → ${hit.lens_model || `${hit.set_focal_length}mm focal length`}${hit.match_lens_id_regex ? ` if Lens ID matches ${hit.match_lens_id_regex}` : ""}`
    : `No rule matches; the file stays unchanged${cameraExcluded ? " (a rule exists, but excludes this camera)" : ""}.`;
  result.className = `probe-result ${hit ? "status-good" : ""}`;
}

async function quarantineAction(relativePath, action, button) {
  button.disabled = true;
  try {
    const result = await api("/api/quarantine/action", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rel: relativePath, action }),
    });
    toast(action === "retry" ? `Sent back through intake → ${result.moved_to}`
      : action === "prune_verified" ? `Pruned ${result.removed} verified ${result.removed === 1 ? "copy" : "copies"}${result.kept ? `; kept ${result.kept} whose bytes differed` : ""}`
      : `Staged for manual deletion → ${result.moved_to}`);
    await renderAttention();
  } catch (error) {
    toast(error.message, true);
    button.disabled = false;
  }
}

async function resolveDecision(id, choice, button) {
  button.disabled = true;
  try {
    const result = await api("/api/decision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, choice }),
    });
    toast(result.outcome || "Lens decision saved");
    await renderAttention();
  } catch (error) {
    toast(error.message, true);
    button.disabled = false;
  }
}

view.addEventListener("error", event => {
  const image = event.target.closest?.("img.preview-image");
  if (!image) return;
  const placeholder = document.createElement("div");
  placeholder.className = image.classList.contains("decision-thumb") ? "decision-thumb media-placeholder" : "media-placeholder";
  placeholder.textContent = image.dataset.placeholder || "No preview";
  image.replaceWith(placeholder);
}, true);

view.addEventListener("click", async event => {
  const target = event.target;
  try {
    const retry = target.closest("[data-action='retry-route']");
    if (retry) { await render(); return; }

    const day = target.closest("[data-day]");
    if (day) { await renderDay(day.dataset.day); return; }

    if (target.closest("[data-action='back-library']")) { await renderLibrary(); return; }

    const switchButton = target.closest("[data-switch]");
    if (switchButton) { await flipSwitch(switchButton.dataset.switch, switchButton); return; }

    const folderButton = target.closest("[data-remove-folder]");
    if (folderButton) { await removeFolder(Number(folderButton.dataset.removeFolder)); return; }

    const editButton = target.closest("[data-edit-rule]");
    if (editButton) { editRule(Number(editButton.dataset.editRule)); return; }

    const deleteButton = target.closest("[data-delete-rule]");
    if (deleteButton) {
      if (deleteButton.dataset.armed === "1" && Date.now() - Number(deleteButton.dataset.armedAt || 0) > 400) {
        await deleteRule(Number(deleteButton.dataset.deleteRule));
      } else {
        deleteButton.dataset.armed = "1";
        deleteButton.dataset.armedAt = String(Date.now());
        deleteButton.textContent = "Confirm delete";
        setTimeout(() => {
          if (deleteButton.isConnected) { deleteButton.dataset.armed = "0"; deleteButton.textContent = "Delete"; }
        }, 4000);
      }
      return;
    }

    if (target.closest("[data-action='cancel-rule']")) { $("#rule-form").innerHTML = ""; return; }

    const unpick = target.closest("[data-unpick]");
    if (unpick) {
      pickers[unpick.dataset.unpick].splice(Number(unpick.dataset.index), 1);
      renderPicker(unpick.dataset.unpick);
      return;
    }

    const decision = target.closest("[data-decision]");
    if (decision) { await resolveDecision(decision.dataset.decision, decision.dataset.choice, decision); return; }

    const quarantine = target.closest("[data-quarantine]");
    if (quarantine) {
      const action = quarantine.dataset.quarantine;
      const armedRecently = quarantine.dataset.armed === "1" && Date.now() - Number(quarantine.dataset.armedAt || 0) > 400;
      if ((action === "trash" || action === "prune_verified") && !armedRecently) {
        quarantine.dataset.armed = "1";
        quarantine.dataset.armedAt = String(Date.now());
        quarantine.dataset.restingLabel = quarantine.textContent;
        quarantine.textContent = action === "trash" ? "Confirm stage" : "Confirm prune";
        setTimeout(() => {
          if (quarantine.isConnected && quarantine.dataset.armed === "1") { quarantine.dataset.armed = "0"; quarantine.textContent = quarantine.dataset.restingLabel; }
        }, 4000);
        return;
      }
      await quarantineAction(quarantine.dataset.rel, action, quarantine);
    }
  } catch (error) {
    toast(error.message, true);
  }
});

view.addEventListener("submit", async event => {
  event.preventDefault();
  try {
    if (event.target.id === "folder-form") {
      const path = $("#folder-path").value.trim();
      if (path) await addFolder(path);
    } else if (event.target.id === "lens-rule-form") {
      const submit = event.target.querySelector("[type='submit']");
      submit.disabled = true;
      try { await saveRule(Number(event.target.dataset.ruleIndex)); }
      finally { if (submit.isConnected) submit.disabled = false; }
    }
  } catch (error) {
    toast(error.message, true);
  }
});

view.addEventListener("change", event => {
  const picker = event.target.closest("select[data-picker]");
  if (!picker) return;
  const id = picker.dataset.picker;
  if (picker.value === "__custom__") {
    const input = document.createElement("input");
    input.type = "text";
    input.dataset.pickerCustom = id;
    input.placeholder = "Camera name substring";
    input.setAttribute("aria-label", "Custom camera name substring");
    picker.replaceWith(input);
    input.focus();
  } else if (picker.value && !pickers[id].includes(picker.value)) {
    pickers[id].push(picker.value);
    renderPicker(id);
  }
});

view.addEventListener("keydown", event => {
  const input = event.target.closest("input[data-picker-custom]");
  if (!input || event.key !== "Enter") return;
  event.preventDefault();
  const value = input.value.trim();
  if (value && !pickers[input.dataset.pickerCustom].includes(value)) pickers[input.dataset.pickerCustom].push(value);
  renderPicker(input.dataset.pickerCustom);
});

view.addEventListener("input", event => {
  if (event.target.matches("#rule-probe, #rule-camera")) probeRule();
});

async function render({ focus = true } = {}) {
  clearInterval(pollTimer);
  rawRoute = location.hash.slice(1) || "now";
  tab = normalizeRoute(rawRoute);
  renderTabs();
  document.title = `${TABS.find(([id]) => id === tab)[1]} · Camera Dropbox`;
  try {
    if (tab === "now") await renderNow();
    else {
      const page = tab === "library" ? renderLibrary()
        : tab === "attention" ? renderAttention()
        : renderAutomations();
      await Promise.all([page, refreshChrome()]);
    }
    if (focus) requestAnimationFrame(() => view.focus({ preventScroll: true }));
  } catch (error) {
    routeError(error);
    refreshChrome();
  }
  pollTimer = setInterval(async () => {
    try {
      if (tab === "now" && !document.hidden && !view.contains(document.activeElement)) await renderNow({ loading: false });
      else await refreshChrome();
    } catch (error) {
      await refreshChrome();
      toast(`Status refresh failed: ${error.message}`, true);
    }
  }, 8000);
}

window.addEventListener("hashchange", () => render());
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    if (tab === "now") renderNow({ loading: false }).catch(error => toast(error.message, true));
    else refreshChrome();
  }
});

renderTabs();
render();
</script>
</body>
</html>
