<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Local control panel for Camera Dropbox: monitor intake, browse accepted files, resolve exceptions, and tune automations.">
<meta name="theme-color" content="#e9ece5">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Camera Dropbox">

<title>Camera Dropbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23171a18'/%3E%3Cpath d='M8 32h48' stroke='%23ee3f29' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23e9ece5' stroke='%23171a18' stroke-width='5'/%3E%3C/svg%3E">
<style>
  @font-face {
    font-family: "Big Shoulders";
    src: url("/assets/big-shoulders.woff2?v=1") format("woff2");
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
  }

  :root {
    color-scheme: light;
    --paper: #e9ece5;
    --sheet: #f8f9f5;
    --sheet-2: #dfe4dc;
    --ink: #171a18;
    --ink-soft: #505751;
    --ink-faint: #5c645e;
    --rule: #aeb5ae;
    --rule-dark: #747b75;
    --signal: #ee3f29;
    --signal-dark: #a61f13;
    --link: #1748c7;
    --healthy: #08744f;
    --warning: #9b4a00;
    --danger: #a61f13;
    --focus: #1748c7;
    --display: "Big Shoulders", "Arial Narrow", sans-serif;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --paper-texture: url("/assets/archival-paper.webp?v=1");
    --paper-wash: linear-gradient(rgb(233 236 229 / .7), rgb(233 236 229 / .7)), var(--paper-texture);
    --sheet-wash: linear-gradient(rgb(248 249 245 / .74), rgb(248 249 245 / .74)), var(--paper-texture);
    --max: 1440px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-width: 320px;
    background-color: var(--paper);
    background-image: var(--paper-wash);
    background-size: auto, 512px 512px;
    color: var(--ink);
    font: 15px/1.48 var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button, input, select { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button { color: inherit; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  .skip-link {
    position: fixed;
    left: 16px;
    top: 12px;
    z-index: 100;
    padding: 10px 14px;
    background: var(--ink);
    color: var(--sheet);
    transform: translateY(-160%);
    transition: transform 180ms ease-out;
  }
  .skip-link:focus { transform: translateY(0); }

  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 20;
    background-color: var(--paper);
    background-image: var(--paper-wash);
    background-size: auto, 512px 512px;
    border-bottom: 1px solid var(--ink);
  }
  .header-inner {
    width: min(100%, var(--max));
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(440px, 1fr) minmax(580px, 1fr);
    grid-template-rows: 84px 28px;
    grid-template-areas:
      "brand nav"
      "state nav";
    align-items: stretch;
    min-height: 112px;
  }
  .brand {
    grid-area: brand;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px clamp(20px, 2.7vw, 40px);
    color: var(--ink);
    text-decoration: none;
    border-right: 1px solid var(--rule-dark);
  }
  .brand-mark {
    position: relative;
    display: none;
    width: 28px;
    height: 28px;
    flex: none;
    border: 1px solid var(--ink);
  }
  .brand-mark::before {
    content: "";
    position: absolute;
    left: -1px;
    right: -1px;
    top: 12px;
    height: 4px;
    background: var(--signal);
  }
  .brand-mark::after {
    content: "";
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    background: var(--sheet);
    border: 2px solid var(--ink);
  }
  .brand-name {
    white-space: nowrap;
    font: 850 clamp(42px, 4.15vw, 60px)/.82 var(--display);
    letter-spacing: -.025em;
    text-transform: uppercase;
  }
  .brand-name span { display: inline; }
  .brand-name span + span::before { content: " "; }

  .primary-nav { grid-area: nav; display: flex; align-items: stretch; }
  .primary-nav a {
    position: relative;
    min-width: 0;
    min-height: 112px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 18px;
    border-right: 1px solid var(--rule-dark);
    color: var(--ink);
    text-decoration: none;
    font: 750 clamp(18px, 1.7vw, 23px)/1 var(--display);
    letter-spacing: .01em;
    text-transform: uppercase;
    transition: background 180ms ease-out, color 180ms ease-out;
  }
  .primary-nav a:first-child { border-left: 1px solid var(--rule-dark); }
  .primary-nav a:hover { background: var(--sheet-2); }
  .primary-nav a[aria-current="page"] {
    background: var(--signal);
    color: #fff;
  }
  .primary-nav a[aria-current="page"]::after {
    content: "";
    position: absolute;
    right: -1px;
    top: -1px;
    border-top: 14px solid var(--paper);
    border-left: 14px solid transparent;
  }
  .nav-count {
    min-width: 21px;
    padding: 3px 5px;
    border: 1px solid currentColor;
    font: 700 10px/1 var(--mono);
    text-align: center;
  }

  .header-state {
    grid-area: state;
    justify-self: stretch;
    min-width: 0;
    min-height: 28px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    padding: 4px clamp(20px, 2.7vw, 40px);
    border-top: 1px solid var(--rule-dark);
  }
  .state-dot {
    width: 10px;
    height: 10px;
    flex: none;
    border-radius: 50%;
    background: var(--ink-faint);
  }
  .state-dot.ok { background: var(--healthy); }
  .state-dot.fail { background: var(--danger); }
  .state-dot.active { background: var(--signal); animation: breathe 1.6s ease-in-out infinite; }
  .header-state-copy strong {
    display: inline;
    font-size: 11px;
    font-weight: 700;
  }
  .header-state-copy span {
    display: inline;
    margin-left: 10px;
    color: var(--ink-soft);
    font: 11px/1.35 var(--mono);
  }

  main {
    width: min(100%, var(--max));
    min-height: calc(100dvh - 113px);
    margin: 0 auto;
    background-color: var(--sheet);
    background-image: var(--sheet-wash);
    background-size: auto, 512px 512px;
    border-inline: 1px solid var(--rule-dark);
  }
  .page { animation: page-in 360ms cubic-bezier(.16, 1, .3, 1) both; }
  .page.no-animation { animation: none; }
  .page-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(220px, auto);
    align-items: end;
    gap: 28px;
    padding: clamp(28px, 5vw, 64px) clamp(20px, 4vw, 56px) 30px;
    border-bottom: 1px solid var(--ink);
  }
  .page-head h1,
  .verdict-title {
    max-width: 13ch;
    margin: 0;
    font: 800 clamp(50px, 7vw, 92px)/.88 var(--display);
    letter-spacing: -.025em;
    text-wrap: balance;
  }
  .page-head p {
    max-width: 62ch;
    margin: 14px 0 0;
    color: var(--ink-soft);
    font-size: 16px;
    text-wrap: pretty;
  }
  .page-meta {
    margin: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(120px, 1fr));
    border: 1px solid var(--rule-dark);
  }
  .page-meta div { padding: 12px 14px; }
  .page-meta div + div { border-left: 1px solid var(--rule-dark); }
  .page-meta dt,
  .fact-label,
  .section-label,
  .meta-label {
    color: var(--ink-soft);
    font: 700 10px/1.2 var(--mono);
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .page-meta dd {
    margin: 5px 0 0;
    font: 700 15px/1.2 var(--mono);
    font-variant-numeric: tabular-nums;
  }

  .verdict-band {
    display: grid;
    grid-template-columns: minmax(500px, .9fr) minmax(600px, 1.1fr);
    border-bottom: 1px solid var(--ink);
  }
  .verdict-copy { padding: clamp(28px, 3.2vw, 46px) clamp(24px, 3.2vw, 46px) 28px; }
  .verdict-title { color: var(--signal); }
  .verdict-sub {
    max-width: 58ch;
    margin: 18px 0 0;
    color: var(--ink-soft);
    font-size: clamp(16px, 1.7vw, 21px);
    text-wrap: pretty;
  }
  .verdict-facts {
    margin: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-left: 1px solid var(--ink);
  }
  .verdict-facts > div {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    min-width: 0;
    padding: clamp(22px, 2.4vw, 34px);
  }
  .verdict-facts > div + div { border-left: 1px solid var(--rule-dark); }
  .fact-value {
    display: block;
    margin-top: 8px;
    font: 750 clamp(30px, 4vw, 54px)/.95 var(--display);
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .fact-detail {
    display: block;
    margin-top: 8px;
    color: var(--ink-soft);
    font: 12px/1.45 var(--mono);
  }
  .status-good { color: var(--healthy); }
  .status-bad { color: var(--danger); }

  .intake {
    padding: 18px clamp(24px, 3.2vw, 46px) 20px;
    border-bottom: 1px solid var(--ink);
  }
  .intake-title-row,
  .section-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 18px;
  }
  .section-title-row h2,
  .section-title {
    margin: 0;
    font: 750 clamp(24px, 3vw, 36px)/1 var(--display);
    letter-spacing: -.01em;
    text-transform: uppercase;
  }
  .intake-note { color: var(--ink-soft); font: 11px/1.4 var(--mono); }
  .intake-track {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    isolation: isolate;
  }
  .intake-track::before,
  .intake-track::after {
    content: "";
    position: absolute;
    z-index: -1;
    top: 20px;
    left: 5%;
    right: 5%;
    height: 2px;
    background: var(--rule-dark);
  }
  .intake-track.active::after {
    background: var(--signal);
    transform-origin: left;
    animation: intake-line 2.6s cubic-bezier(.16, 1, .3, 1) infinite;
  }
  .stage { min-width: 0; text-align: center; }
  .stage-node {
    width: 18px;
    height: 18px;
    margin: 12px auto 14px;
    border-radius: 50%;
    border: 3px solid var(--sheet);
    background: var(--ink);
    box-shadow: 0 0 0 1px var(--ink);
  }
  .active .stage-node { background: var(--signal); box-shadow: 0 0 0 1px var(--signal); }
  .stage-name {
    display: block;
    font: 750 17px/1 var(--display);
    text-transform: uppercase;
  }
  .stage-value {
    display: block;
    margin-top: 6px;
    font: 700 13px/1.2 var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .stage-detail { display: block; margin-top: 4px; color: var(--ink-soft); font-size: 12px; }

  .now-grid {
    display: grid;
    grid-template-columns: minmax(250px, 286px) minmax(0, 1fr);
    align-items: stretch;
    border-bottom: 1px solid var(--ink);
  }
  .recent { min-width: 0; padding: 26px clamp(22px, 2.5vw, 36px) 30px; }
  .attention-register {
    position: relative;
    padding: 0 22px 30px;
    background-color: #f1d8d1;
    background-image: linear-gradient(rgb(241 216 209 / .78), rgb(241 216 209 / .78)), var(--paper-texture);
    background-size: auto, 512px 512px;
    border-right: 1px solid var(--ink);
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
  }
  .attention-register h2 {
    margin: 0 -22px 12px;
    padding: 15px 22px 14px;
    background: var(--signal);
    color: #fff;
    font: 800 30px/1 var(--display);
    text-transform: uppercase;
  }
  .attention-item { padding: 16px 0; border-top: 1px solid color-mix(in srgb, var(--danger) 44%, transparent); }
  .attention-item:first-of-type { border-top-color: var(--danger); }
  .attention-item strong { display: block; font: 700 20px/1.1 var(--display); }
  .attention-item p { margin: 7px 0 0; color: #54251f; font-size: 13px; }
  .attention-clear { margin: 0; color: #2f4d3f; }

  .proof-grid,
  .library-grid {
    display: grid;
    gap: 1px;
    background: var(--rule-dark);
    border: 1px solid var(--rule-dark);
  }
  .proof-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .library-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .proof-grid {
    gap: 0;
    background: transparent;
    border-right: 0;
  }
  .proof-grid .proof { border-right: 1px solid var(--rule-dark); }
  .proof {
    min-width: 0;
    margin: 0;
    background: var(--sheet);
  }
  .proof-media {
    position: relative;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: var(--sheet-2);
  }
  .proof-media img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform 280ms cubic-bezier(.16, 1, .3, 1), filter 280ms ease-out;
  }
  .proof:hover img { transform: scale(1.018); filter: contrast(1.03); }
  .media-placeholder {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    padding: 18px;
    color: var(--ink-soft);
    font: 700 12px/1.3 var(--mono);
    letter-spacing: .08em;
    text-align: center;
    text-transform: uppercase;
  }
  .proof figcaption { padding: 14px 14px 16px; }
  .file-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font: 700 13px/1.25 var(--mono);
  }
  .file-meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 7px;
    color: var(--ink-soft);
    font: 11px/1.25 var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .file-destination {
    display: inline-block;
    margin-top: 12px;
    color: var(--link);
    font: 700 11px/1.3 var(--mono);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .mechanism {
    display: grid;
    grid-template-columns: minmax(220px, .9fr) repeat(4, minmax(0, 1fr));
    border-bottom: 1px solid var(--ink);
    counter-reset: protection;
  }
  .mechanism-heading {
    display: flex;
    align-items: center;
    padding: 22px clamp(18px, 2.4vw, 34px);
    font: 800 27px/.95 var(--display);
    text-transform: uppercase;
  }
  .mechanism article {
    counter-increment: protection;
    padding: 20px clamp(15px, 1.7vw, 24px) 24px;
    border-left: 1px solid var(--rule-dark);
  }
  .mechanism article::before {
    content: "0" counter(protection);
    display: block;
    margin-bottom: 10px;
    color: var(--signal-dark);
    font: 700 10px/1 var(--mono);
    letter-spacing: .08em;
  }
  .mechanism h3 {
    margin: 0;
    font: 750 19px/1 var(--display);
    text-transform: uppercase;
  }
  .mechanism p { max-width: 34ch; margin: 8px 0 0; color: var(--ink-soft); font-size: 12px; }

  .empty-state {
    padding: clamp(36px, 6vw, 82px) clamp(20px, 5vw, 72px);
    background: var(--sheet-2);
    border: 1px solid var(--rule-dark);
  }
  .empty-state h2 { max-width: 12ch; margin: 0; font: 800 clamp(38px, 5vw, 66px)/.9 var(--display); }
  .empty-state > p { max-width: 60ch; margin: 14px 0 0; color: var(--ink-soft); }
  .setup-steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin-top: 34px;
    border-block: 1px solid var(--rule-dark);
  }
  .setup-steps article { padding: 20px 20px 24px 0; }
  .setup-steps article + article { padding-left: 20px; border-left: 1px solid var(--rule-dark); }
  .setup-steps strong { display: block; font: 750 20px/1 var(--display); text-transform: uppercase; }
  .setup-steps p { margin: 8px 0 0; color: var(--ink-soft); font-size: 13px; }

  .content-section { padding: 34px clamp(20px, 4vw, 56px) 48px; border-bottom: 1px solid var(--ink); }
  .content-section + .content-section { padding-top: 48px; }
  .section-copy { max-width: 68ch; margin: 8px 0 24px; color: var(--ink-soft); text-wrap: pretty; }
  .text-link,
  .link-button {
    appearance: none;
    padding: 0;
    border: 0;
    background: none;
    color: var(--link);
    cursor: pointer;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .text-link:hover, .link-button:hover { color: #0e318c; }

  .register-list { border-top: 1px solid var(--ink); }
  .register-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 18px;
    min-height: 62px;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule);
  }
  button.register-row {
    width: 100%;
    cursor: pointer;
    background: transparent;
    border-inline: 0;
    border-top: 0;
    text-align: left;
    transition: background 160ms ease-out;
  }
  button.register-row:hover { background: var(--sheet-2); }
  button.register-row .row-main { transition: transform 180ms cubic-bezier(.16, 1, .3, 1); }
  button.register-row:hover .row-main { transform: translateX(8px); }
  .row-main { min-width: 0; }
  .row-title {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font: 700 14px/1.3 var(--mono);
  }
  .row-detail { display: block; margin-top: 4px; color: var(--ink-soft); font-size: 12px; }
  .row-value { font: 800 24px/1 var(--display); font-variant-numeric: tabular-nums; }
  .row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

  .button {
    appearance: none;
    position: relative;
    min-height: 42px;
    padding: 11px 16px;
    border: 1px solid var(--ink);
    border-radius: 2px;
    background: var(--ink);
    color: var(--sheet);
    cursor: pointer;
    font: 750 14px/1 var(--display);
    letter-spacing: .025em;
    text-transform: uppercase;
    transition: transform 160ms ease-out, background 160ms ease-out, color 160ms ease-out;
  }
  .button:hover { background: var(--signal); border-color: var(--signal); }
  .button:active { transform: translateY(1px); }
  .button.secondary { background: transparent; color: var(--ink); }
  .button.secondary:hover { background: var(--sheet-2); border-color: var(--ink); }
  .button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .button.danger:hover { background: var(--danger); color: #fff; }
  .button.quiet { min-height: 36px; padding: 8px 10px; border-color: transparent; background: transparent; color: var(--link); }
  .button.quiet:hover { background: var(--sheet-2); border-color: var(--rule-dark); color: var(--ink); }
  .button:disabled { cursor: wait; opacity: .48; }

  .notice {
    margin-bottom: 24px;
    padding: 16px 18px;
    border: 1px solid var(--warning);
    background: #f4e3cc;
    color: #502700;
  }
  .notice.danger { border-color: var(--danger); background: #f1d8d1; color: #54251f; }
  .notice strong { display: block; }
  .notice p { margin: 4px 0 0; }

  .issue-block {
    display: grid;
    grid-template-columns: minmax(170px, 240px) minmax(0, 1fr);
    border-top: 1px solid var(--ink);
  }
  .issue-heading { padding: 22px 24px 28px 0; }
  .issue-heading h2 { margin: 0; font: 800 30px/1 var(--display); text-transform: uppercase; }
  .issue-heading p { margin: 8px 0 0; color: var(--ink-soft); font-size: 13px; }
  .issue-content { min-width: 0; padding: 12px 0 34px 24px; border-left: 1px solid var(--rule-dark); }
  .issue-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 18px;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
  }
  .decision-row { grid-template-columns: 108px minmax(0, 1fr); align-items: start; }
  .decision-thumb { width: 108px; aspect-ratio: 4/3; object-fit: cover; background: var(--sheet-2); }
  .decision-options { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

  .automation-group {
    display: grid;
    grid-template-columns: minmax(180px, 260px) minmax(0, 1fr);
    border-top: 1px solid var(--ink);
  }
  .automation-intro { padding: 24px 28px 30px 0; }
  .automation-intro h2 { margin: 0; font: 800 30px/1 var(--display); text-transform: uppercase; }
  .automation-intro p { margin: 10px 0 0; color: var(--ink-soft); font-size: 13px; }
  .automation-list { border-left: 1px solid var(--rule-dark); }
  .automation-panel { padding: 24px 0 30px 24px; }
  .switch-row {
    display: grid;

    </a>

    </div>
  </div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

const $ = (selector, root = document) => root.querySelector(selector);
const view = $("#view");
const TABS = [
  ["now", "Now"],
  ["library", "Library"],
  ["attention", "Attention"],
  ["automations", "Automations"],
];
const ROUTE_ALIASES = {
  overview: "now",
  folders: "library",
  quarantine: "attention",
  decisions: "attention",
  switches: "automations",
  rules: "automations",
};
const THUMB_V = 2;
let rawRoute = location.hash.slice(1) || "now";
let tab = normalizeRoute(rawRoute);
let attentionCount = 0;
let config = null;
let pollTimer = null;
let CAMERAS = [];
const pickers = {};

function normalizeRoute(route) {
  const normalized = ROUTE_ALIASES[route] || route;
  return TABS.some(([id]) => id === normalized) ? normalized : "now";
}

async function api(path, options) {
  const response = await fetch(path, options);
  const isJson = (response.headers.get("content-type") || "").includes("json");
  const body = isJson ? await response.json() : null;
  if (!response.ok) throw new Error((body && body.error) || `Request failed (${response.status})`);
  return body;
}

const esc = value => String(value).replace(/[&<>"']/g, character => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
})[character]);

function bytes(value) {
  if (value == null) return "—";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let unit = 0;
  let number = Number(value);
  while (number >= 1024 && unit < units.length - 1) { number /= 1024; unit += 1; }
  return `${number.toFixed(number >= 100 || unit === 0 ? 0 : 1)} ${units[unit]}`;
}

function age(seconds) {
  if (seconds < 90) return `${seconds}s`;
  if (seconds < 5400) return `${Math.round(seconds / 60)}m`;
  if (seconds < 129600) return `${Math.round(seconds / 3600)}h`;
  return `${Math.round(seconds / 86400)}d`;
}

const hm = timestamp => new Date(timestamp * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const plural = (count, one, many = `${one}s`) => count === 1 ? one : many;

function longDate(date) {
  try {
    return new Date(`${date}T12:00:00`).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  } catch (_) {
    return date;
  }
}

function toast(message, bad = false) {
  const element = $("#toast");
  element.textContent = message;
  element.classList.toggle("bad", bad);
  element.classList.add("show");
  clearTimeout(element._hide);
  element._hide = setTimeout(() => element.classList.remove("show"), 3200);
}

function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([id, label]) => {
    const badge = id === "attention" && attentionCount > 0
      ? `<span class="nav-count" aria-label="${attentionCount} items">${attentionCount > 99 ? "99+" : attentionCount}</span>`
      : "";
    return `<a href="#${id}" ${id === tab ? 'aria-current="page"' : ""}>${label}${badge}</a>`;
  }).join("");
}

function activeQuarantine(files) {
  return files.filter(file => !file.rel.startsWith("_trash/"));
}

function updateChrome(status, quarantineFiles = []) {
  const inbound = status.receiving + status.incoming.length;
  const issues = activeQuarantine(quarantineFiles).length + status.counts.pending_decisions + (status.health.state === "fail" ? 1 : 0);
  attentionCount = issues;
  renderTabs();

  let stateClass = "ok";
  let title = "Monitoring intake";
  let detail = status.health.detail || "No failures reported";
  if (status.health.state === "fail") {
    stateClass = "fail";
    title = "Pipeline needs attention";
  } else if (inbound > 0) {
    stateClass = "active";
    title = `${inbound} ${plural(inbound, "file")} arriving`;
    detail = `${status.receiving} receiving · ${status.incoming.length} waiting or checking`;
  } else if (issues > 0) {
    stateClass = "fail";
    title = `${issues} ${plural(issues, "item")} need attention`;
  }
  $("#header-state").setAttribute("aria-label", `${title}. ${detail}`);
  $("#header-state").innerHTML = `<span class="state-dot ${stateClass}" aria-hidden="true"></span>
    <span class="header-state-copy"><strong>${esc(title)}</strong><span>${esc(detail)}</span></span>`;
}

async function refreshChrome() {
  if (document.hidden) return;
  try {
    const [status, quarantine] = await Promise.all([api("/api/status"), api("/api/quarantine")]);
    updateChrome(status, quarantine.files);
  } catch (_) {
    $("#header-state").setAttribute("aria-label", "Panel unavailable. Could not read local state.");
    $("#header-state").innerHTML = `<span class="state-dot fail" aria-hidden="true"></span>
      <span class="header-state-copy"><strong>Panel unavailable</strong><span>Could not read local state</span></span>`;
  }
}

function loadingPage() {
  view.innerHTML = `<div class="skeleton" aria-label="Loading">
    <div class="skeleton-line title"></div><div class="skeleton-line"></div><div class="skeleton-line"></div>
    <div class="skeleton-block"></div></div>`;
}

function routeError(error) {
  view.innerHTML = `<section class="route-error"><div>
    <h1>Couldn’t load this view</h1>
    <p>${esc(error.message)}</p>
    <button class="button" type="button" data-action="retry-route">Try again</button>
  </div></section>`;
}

function pageHead(title, copy, meta = "") {
  return `<header class="page-head"><div><h1>${esc(title)}</h1><p>${copy}</p></div>${meta}</header>`;
}

function firstRun() {
  const host = location.hostname || "this server";
  return `<div class="empty-state">
    <h2>Ready for your first camera</h2>
    <p>Add this box to your camera’s FTP settings, take one frame, and watch it move from intake to the date-sorted library.</p>
    <div class="setup-steps">
      <article><strong>Use FTP</strong><p>Server <span class="row-title">${esc(host)}</span>, port <span class="row-title">21</span>, passive mode. Use the credentials configured on this box.</p></article>
      <article><strong>Turn security off</strong><p>Select FTP—not SFTP or FTPS—and disable secure transfer in the camera menu.</p></article>
      <article><strong>Send one frame</strong><p>Keep the camera connected while the file settles. Accepted files appear here after structural checks finish.</p></article>
    </div>
  </div>`;
}

function canPreview(name) {
  return /\.(nef|arw|raf|dng|nrw|cr2|cr3|jpe?g|tiff?)$/i.test(name);
}

function proofCard(file, options = {}) {
  const preview = canPreview(file.name)
    ? `<img class="preview-image" loading="lazy" src="/api/thumb?v=${THUMB_V}&amp;f=${encodeURIComponent(file.rel)}" alt="Preview of ${esc(file.name)}" data-placeholder="No preview">`
    : `<div class="media-placeholder">${esc((file.type || "file").toUpperCase())}</div>`;
  const destination = options.destination === false ? "" : `<button class="link-button file-destination" type="button" data-day="${esc(file.date)}">Filed ${esc(file.date)} / ${esc(file.type)}</button>`;
  return `<figure class="proof"><div class="proof-media">${preview}</div><figcaption>
    <div class="file-name" title="${esc(file.name)}">${esc(file.name)}</div>
    <div class="file-meta"><span>${esc((file.type || "file").toUpperCase())}</span><span>${hm(file.mtime)}</span></div>
    ${destination}
  </figcaption></figure>`;
}

function attentionRegister(status, quarantineFiles) {
  const quarantine = activeQuarantine(quarantineFiles);
  const decisions = status.counts.pending_decisions;
  const items = [];
  if (status.health.state === "fail") items.push(`<div class="attention-item"><strong>Pipeline alert</strong><p>${esc(status.health.detail || "The health check reported a problem.")}</p></div>`);
  if (quarantine.length) items.push(`<div class="attention-item"><strong>${quarantine.length} ${plural(quarantine.length, "file")} held</strong><p>Held files stay recoverable until you retry or stage them for deletion.</p></div>`);
  if (decisions) items.push(`<div class="attention-item"><strong>${decisions} lens ${plural(decisions, "decision")}</strong><p>Unanswered questions leave the original metadata unchanged.</p></div>`);
  return `<aside class="attention-register ${items.length ? "has-issues" : "is-clear"}" aria-labelledby="attention-title">
    <h2 id="attention-title">Attention</h2>
    ${items.length ? items.join("") + '<a class="text-link" href="#attention">Review attention</a>' : '<p class="attention-clear"><strong>Nothing needs you.</strong><br>Held files and metadata questions will appear here.</p>'}
  </aside>`;
}

async function renderNow({ loading = true } = {}) {
  if (loading) loadingPage();
  const [status, recent, quarantine] = await Promise.all([
    api("/api/status"), api("/api/recent?limit=12"), api("/api/quarantine"),
  ]);
  if (tab !== "now") return;
  updateChrome(status, quarantine.files);

  const inbound = status.receiving + status.incoming.length;
  const quarantineOpen = activeQuarantine(quarantine.files).length;
  const issueCount = quarantineOpen + status.counts.pending_decisions + (status.health.state === "fail" ? 1 : 0);
  let title = "Ready for your next upload";
  let sub = "Your camera sends. This box waits, checks the file structure, and files accepted media by capture date.";
  if (status.health.state === "fail") {
    title = "The pipeline needs attention";
    sub = "Your files stay in place while you review the reported problem. No held file is deleted automatically.";
  } else if (inbound > 0) {
    title = `${inbound} ${plural(inbound, "file")} ${inbound === 1 ? "is" : "are"} arriving`;
    sub = "Leave the camera connected. New files remain in intake until writes settle and structural checks finish.";
  } else if (issueCount > 0) {
    title = `${issueCount} ${plural(issueCount, "item")} need attention`;
    sub = "Accepted files are already in the library. Review held transfers or optional lens metadata questions when you’re ready.";
  }

  const freePercent = status.disk.total ? Math.round(status.disk.free / status.disk.total * 100) : 0;
  const healthClass = status.health.state === "fail" ? "status-bad" : "status-good";
  const healthValue = status.health.state === "fail" ? "Attention" : "Monitoring";
  const recentFiles = recent.files.slice(0, 12);
  const recentMarkup = recentFiles.length
    ? `<div class="proof-grid">${recentFiles.map(file => proofCard(file)).join("")}</div>`
    : firstRun();

  view.innerHTML = `<div class="page ${loading ? "" : "no-animation"}">
    <section class="verdict-band" aria-labelledby="now-verdict">
      <div class="verdict-copy"><h1 class="verdict-title" id="now-verdict">${esc(title)}</h1><p class="verdict-sub">${esc(sub)}</p></div>
      <dl class="verdict-facts">
        <div><dt class="fact-label">Pipeline evidence</dt><dd class="fact-value ${healthClass}">${healthValue}</dd><span class="fact-detail">${esc(status.health.detail || "No failures reported")}</span></div>
        <div><dt class="fact-label">Storage available</dt><dd class="fact-value">${bytes(status.disk.free)}</dd><span class="fact-detail">${freePercent}% of ${bytes(status.disk.total)} available</span></div>
      </dl>
    </section>
    <section class="intake" aria-labelledby="intake-title">
      <div class="intake-title-row"><h2 class="section-title" id="intake-title">How intake stands now</h2><span class="intake-note">Activity line shows aggregate intake, not per-file progress.</span></div>
      <div class="intake-track ${inbound ? "active" : ""}">
        <div class="stage"><span class="stage-node" aria-hidden="true"></span><span class="stage-name">Camera</span><span class="stage-value">Wi-Fi FTP</span><span class="stage-detail">Native camera transfer</span></div>
        <div class="stage"><span class="stage-node" aria-hidden="true"></span><span class="stage-name">Receiving</span><span class="stage-value">${status.receiving} ${plural(status.receiving, "file")}</span><span class="stage-detail">Still writing to intake</span></div>
        <div class="stage"><span class="stage-node" aria-hidden="true"></span><span class="stage-name">Waiting / checking</span><span class="stage-value">${status.incoming.length} ${plural(status.incoming.length, "file")}</span><span class="stage-detail">Settling or being validated</span></div>
        <div class="stage"><span class="stage-node" aria-hidden="true"></span><span class="stage-name">Filed by date</span><span class="stage-value">${status.counts.sorted_today} dated today</span><span class="stage-detail">Capture date, not arrival time</span></div>
      </div>
      ${inbound ? `<div class="register-list" aria-label="Files currently in intake">${status.incoming.map(file => `<div class="register-row"><div class="row-main"><div class="row-title">${esc(file.name)}</div><div class="row-detail">Waiting or checking · ${age(file.age_s)} in intake</div></div><span class="row-value">${bytes(file.size)}</span></div>`).join("")}</div>` : ""}
    </section>
    <section class="now-grid">
      ${attentionRegister(status, quarantine.files)}
      <div class="recent"><div class="section-title-row"><h2>Recently accepted</h2>${recent.files.length ? '<a class="text-link" href="#library">Open library</a>' : ""}</div>${recentMarkup}</div>
    </section>
    <section class="mechanism" aria-labelledby="protection-title">
      <header class="mechanism-heading" id="protection-title">Protection by design</header>
      <article><h3>Waits for stability</h3><p>Fresh uploads must stop changing before the sorter moves on.</p></article>
      <article><h3>Checks file structure</h3><p>RAW, image, HEIF, and video payloads get format-specific integrity checks.</p></article>
      <article><h3>Never overwrites</h3><p>Name collisions create a suffixed copy. The existing file stays untouched.</p></article>
      <article><h3>Files by capture date</h3><p>Accepted media lands under its recorded photo date and file type.</p></article>
    </section>

function quarantineRows(files) {
  if (!files.length) return '<p class="section-copy">No active quarantine files. Nothing is waiting for a retry or deletion decision.</p>';
  return `<div class="register-list">${files.map(file => `<div class="issue-row">
    <div class="row-main"><div class="row-title">${esc(file.rel)}</div><div class="row-detail">${bytes(file.size)} · held ${age(Math.max(0, Math.round(Date.now() / 1000 - file.mtime)))} ago · original remains recoverable</div></div>

}

function decisionRows(pending, presets) {
  if (!pending.length) return '<p class="section-copy">No lens questions are open. Files with known or untouched lens metadata need no decision.</p>';
  return pending.map(question => `<div class="issue-row decision-row">
    <img class="decision-thumb preview-image" loading="lazy" src="/api/thumb?v=${THUMB_V}&amp;f=${encodeURIComponent(question.rel)}" alt="Preview of ${esc(question.rel)}" data-placeholder="No preview">
    <div class="row-main">
      <div class="row-title">${esc(question.rel)}</div>
      <div class="row-detail">${question.camera ? `${esc(question.camera)} · ` : ""}Lens ${esc(question.lens || "unknown")} · Lens ID ${esc(question.lensid || "unknown")}</div>
      <div class="decision-options">
        ${presets.map((preset, index) => `<button class="button secondary" type="button" data-decision="${esc(question.id)}" data-choice="${index}">${esc(preset.label)}</button>`).join("")}

      </div>
    </div>
  </div>`).join("");
}

async function renderAttention() {
  loadingPage();
  const [status, quarantine, decisions, cfg] = await Promise.all([
    api("/api/status"), api("/api/quarantine"), api("/api/decisions"), api("/api/config"),
  ]);
  if (tab !== "attention") return;
  config = cfg;
  const active = activeQuarantine(quarantine.files);
  const issueTotal = active.length + decisions.pending.length + (status.health.state === "fail" ? 1 : 0);
  updateChrome(status, quarantine.files);
  const meta = `<dl class="page-meta"><div><dt>Needs action</dt><dd>${issueTotal}</dd></div><div><dt>Pending questions</dt><dd>${decisions.pending.length}</dd></div></dl>`;
  const healthNotice = status.health.state === "fail"
    ? `<div class="notice danger"><strong>Pipeline health check reported a problem</strong><p>${esc(status.health.detail || "Review the host health check for details.")}</p></div>`
    : "";
  const clearState = issueTotal === 0
    ? '<div class="empty-state"><h2>Nothing needs you</h2><p>Accepted files are in the library. Held transfers and optional lens questions will appear here when intervention is useful.</p></div>'
    : "";
  const resolved = decisions.resolved.length
    ? `<div class="register-list">${decisions.resolved.map(item => `<div class="register-row"><div class="row-main"><div class="row-title">${esc(item.rel || "Unknown file")}</div><div class="row-detail">${esc(item.outcome || "Resolved")} · via ${esc(item.via || "panel")}</div></div></div>`).join("")}</div>`
    : '<p class="section-copy">No recent lens decisions are recorded.</p>';

  view.innerHTML = `<div class="page">${pageHead("Attention", "One place for pipeline alerts, held files, and optional metadata questions. Nothing here deletes an original automatically.", meta)}
    <section class="content-section">${healthNotice}${clearState}
      <div class="issue-block"><div class="issue-heading"><h2>Held files</h2><p>Retry sends a file back through the full intake checks. Staging moves it under quarantine/_trash for manual cleanup later.</p></div><div class="issue-content">${quarantineRows(active)}</div></div>

      <div class="issue-block"><div class="issue-heading"><h2>Recent answers</h2><p>The latest completed lens questions, whether answered here or through Telegram.</p></div><div class="issue-content">${resolved}</div></div>
    </section>
  </div>`;
}

    label: "Apply lens metadata rules",
    description: "Rewrite identity tags for matching adapted lenses on new NEFs. Exposure values are never changed.",
  },
  nef_render_queue: {
    label: "Create recipe TIFF renders",
    description: "Send new NEFs to the configured render queue so the host workflow can place a recipe-look TIFF beside the raw.",
  },
  telegram_notifications: {
    label: "Send Telegram digests",
    description: "Send batched sort and quarantine summaries when Telegram credentials are mounted on the host.",
  },
  watch_funnel: {
    label: "Watch extra folders",
    description: "Move settled files from the folders below into the normal intake pipeline.",
  },
  ask_on_unknown: {
    label: "Ask about unknown lenses",
    description: "Create an Attention item for unmatched non-Nikkor glass. Unanswered questions close without changing the file.",

function switchRow(key) {
  const item = SWITCHES[key];
  const on = config.features[key] !== false;
  return `<div class="switch-row"><div><strong>${esc(item.label)}</strong><p>${esc(item.description)}</p></div>
    <button class="switch" type="button" role="switch" aria-checked="${on}" aria-label="${esc(item.label)}" data-switch="${key}"></button></div>`;

  const invalid = config._invalid ? `<div class="notice danger"><strong>The saved configuration could not be read</strong><p>Defaults are shown. The next successful change will replace the invalid file with a validated configuration.</p></div>` : "";

      <div class="automation-group"><div class="automation-intro"><h2>Outputs</h2><p>Create optional derivatives and low-noise phone summaries.</p></div><div class="automation-list">${switchRow("nef_render_queue")}${switchRow("telegram_notifications")}</div></div>
      <div class="automation-group"><div class="automation-intro"><h2>Lens metadata</h2><p>Name adapted glass consistently without touching exposure values.</p></div><div class="automation-list">${switchRow("lens_massage")}${switchRow("ask_on_unknown")}${lensRulesMarkup(forceRules)}</div></div>
    </section>

async function flipSwitch(key, button) {
  button.disabled = true;
  const next = !(config.features[key] !== false);
  try {
    config = await api("/api/config", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ features: { [key]: next } }),
    });
    button.setAttribute("aria-checked", String(config.features[key] !== false));
    toast(`${SWITCHES[key].label}: ${config.features[key] !== false ? "on" : "off"}`);
  } catch (error) {
    toast(error.message, true);
  } finally {
    button.disabled = false;
  }
}

async function addFolder(path) {
  if (config.watched_folders.includes(path)) {
    toast("That folder is already registered", true);
    return;
  }
  config = await api("/api/config", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ watched_folders: [...config.watched_folders, path] }),
  });
  toast(`Watching ${path}`);
  await renderAutomations();
}

async function removeFolder(index) {
  const removed = config.watched_folders[index];
  config = await api("/api/config", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ watched_folders: config.watched_folders.filter((_, itemIndex) => itemIndex !== index) }),
  });
  toast(`Stopped watching ${removed}`);
  await renderAutomations();
}

function renderPicker(id) {
  const box = $(`#${id}`);
  if (!box) return;
  const selected = pickers[id] || [];
  box.innerHTML = selected.map((camera, index) => `<span class="chip">${esc(camera)}<button type="button" data-unpick="${id}" data-index="${index}" aria-label="Remove ${esc(camera)}">×</button></span>`).join("") +
    `<select data-picker="${id}" aria-label="Add camera filter"><option value="">Add camera…</option>
      ${CAMERAS.filter(camera => !selected.includes(camera.name)).map(camera => `<option value="${esc(camera.name)}">${esc(camera.name)} · ${camera.count}</option>`).join("")}
      <option value="__custom__">Custom substring…</option></select>`;
}

function editRule(index) {
  const rule = index >= 0 ? config.lens_rules[index] : {};
  const form = $("#rule-form");
  form.innerHTML = `<form class="rule-form" id="lens-rule-form" data-rule-index="${index}">
    <label class="field-label" for="rule-match">Match Lens values<span class="field-help">Comma-separated exact EXIF Lens strings.</span></label><input type="text" id="rule-match" value="${esc((rule.match_lens || []).join(", "))}" placeholder="50mm f/1.2, 50mm f/1.3" required>
    <label class="field-label" for="rule-regex">Lens ID regular expression<span class="field-help">Optional POSIX ERE. \\d and (?:…) are not supported by the sorter.</span></label><input type="text" id="rule-regex" value="${esc(rule.match_lens_id_regex || "")}" placeholder="Leica.*35">
    <span class="field-label">Only these cameras<span class="field-help">Blank matches every body.</span></span><div class="picker" id="rule-include"></div>
    <span class="field-label">Never these cameras</span><div class="picker" id="rule-exclude"></div>
    <label class="field-label" for="rule-model">Set lens model</label><input type="text" id="rule-model" value="${esc(rule.lens_model || "")}" placeholder="FE 50mm F1.2 GM">
    <label class="field-label" for="rule-info">Set lens info</label><input type="text" id="rule-info" value="${esc(rule.lens_info || "")}" placeholder="50 50 1.2 1.2">
    <label class="field-label" for="rule-focal">Set focal length</label><input type="text" id="rule-focal" value="${esc(rule.set_focal_length || "")}" placeholder="35">
    <div class="form-actions"><button class="button secondary" type="button" data-action="cancel-rule">Cancel</button><button class="button" type="submit">Save rule</button></div>
  </form>`;
  pickers["rule-include"] = [...(rule.match_camera || [])];
  pickers["rule-exclude"] = [...(rule.exclude_camera || [])];
  renderPicker("rule-include");
  renderPicker("rule-exclude");
  $("#rule-match")?.focus();
}

function readRuleForm() {
  const rule = {};
  const match = $("#rule-match").value.split(",").map(value => value.trim()).filter(Boolean);
  if (match.length) rule.match_lens = match;
  const regex = $("#rule-regex").value.trim();
  if (regex) rule.match_lens_id_regex = regex;
  if ((pickers["rule-include"] || []).length) rule.match_camera = [...pickers["rule-include"]];
  if ((pickers["rule-exclude"] || []).length) rule.exclude_camera = [...pickers["rule-exclude"]];
  const model = $("#rule-model").value.trim();
  if (model) rule.lens_model = model;
  const info = $("#rule-info").value.trim();
  if (info) rule.lens_info = info;
  const focal = $("#rule-focal").value.trim();
  if (focal) rule.set_focal_length = focal;
  return rule;
}

async function saveRule(index) {
  const rules = [...config.lens_rules];
  const rule = readRuleForm();
  if (index >= 0) rules[index] = rule;
  else rules.push(rule);
  config = await api("/api/config", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ lens_rules: rules }),
  });
  toast(index >= 0 ? "Lens rule updated" : "Lens rule added");
  await renderAutomations();
}

async function deleteRule(index) {
  config = await api("/api/config", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ lens_rules: config.lens_rules.filter((_, ruleIndex) => ruleIndex !== index) }),
  });
  toast("Lens rule deleted");
  await renderAutomations();
}

function probeRule() {
  const result = $("#probe-result");
  if (!result || !config) return;
  const signature = $("#rule-probe")?.value.trim() || "";
  const camera = ($("#rule-camera")?.value || "").trim().toLowerCase();
  if (!signature) { result.textContent = ""; return; }
  const cameraMatches = rule =>
    (!rule.match_camera || rule.match_camera.some(value => camera.includes(value.toLowerCase()))) &&
    (!rule.exclude_camera || !rule.exclude_camera.some(value => camera.includes(value.toLowerCase())));
  const hit = config.lens_rules.find(rule => rule.match_lens.includes(signature) && cameraMatches(rule));
  const cameraExcluded = config.lens_rules.some(rule => rule.match_lens.includes(signature) && !cameraMatches(rule));
  result.textContent = hit
    ? `Matches → ${hit.lens_model || `${hit.set_focal_length}mm focal length`}${hit.match_lens_id_regex ? ` if Lens ID matches ${hit.match_lens_id_regex}` : ""}`
    : `No rule matches; the file stays unchanged${cameraExcluded ? " (a rule exists, but excludes this camera)" : ""}.`;
  result.className = `probe-result ${hit ? "status-good" : ""}`;
}

async function quarantineAction(relativePath, action, button) {
  button.disabled = true;
  try {
    const result = await api("/api/quarantine/action", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rel: relativePath, action }),
    });
    toast(action === "retry" ? `Sent back through intake → ${result.moved_to}` : `Staged for manual deletion → ${result.moved_to}`);
    await renderAttention();
  } catch (error) {
    toast(error.message, true);
    button.disabled = false;
  }
}

async function resolveDecision(id, choice, button) {
  button.disabled = true;
  try {
    const result = await api("/api/decision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, choice }),
    });
    toast(result.outcome || "Lens decision saved");
    await renderAttention();
  } catch (error) {
    toast(error.message, true);
    button.disabled = false;
  }
}

view.addEventListener("error", event => {
  const image = event.target.closest?.("img.preview-image");
  if (!image) return;
  const placeholder = document.createElement("div");
  placeholder.className = image.classList.contains("decision-thumb") ? "decision-thumb media-placeholder" : "media-placeholder";
  placeholder.textContent = image.dataset.placeholder || "No preview";
  image.replaceWith(placeholder);
}, true);

view.addEventListener("click", async event => {
  const target = event.target;
  try {
    const retry = target.closest("[data-action='retry-route']");
    if (retry) { await render(); return; }

    const day = target.closest("[data-day]");
    if (day) { await renderDay(day.dataset.day); return; }

    if (target.closest("[data-action='back-library']")) { await renderLibrary(); return; }

    const switchButton = target.closest("[data-switch]");
    if (switchButton) { await flipSwitch(switchButton.dataset.switch, switchButton); return; }

    const folderButton = target.closest("[data-remove-folder]");
    if (folderButton) { await removeFolder(Number(folderButton.dataset.removeFolder)); return; }

    const editButton = target.closest("[data-edit-rule]");
    if (editButton) { editRule(Number(editButton.dataset.editRule)); return; }

    const deleteButton = target.closest("[data-delete-rule]");
    if (deleteButton) {
      if (deleteButton.dataset.armed === "1" && Date.now() - Number(deleteButton.dataset.armedAt || 0) > 400) {
        await deleteRule(Number(deleteButton.dataset.deleteRule));
      } else {
        deleteButton.dataset.armed = "1";
        deleteButton.dataset.armedAt = String(Date.now());
        deleteButton.textContent = "Confirm delete";
        setTimeout(() => {
          if (deleteButton.isConnected) { deleteButton.dataset.armed = "0"; deleteButton.textContent = "Delete"; }
        }, 4000);
      }
      return;
    }

    if (target.closest("[data-action='cancel-rule']")) { $("#rule-form").innerHTML = ""; return; }

    const unpick = target.closest("[data-unpick]");
    if (unpick) {
      pickers[unpick.dataset.unpick].splice(Number(unpick.dataset.index), 1);
      renderPicker(unpick.dataset.unpick);
      return;
    }

    const decision = target.closest("[data-decision]");
    if (decision) { await resolveDecision(decision.dataset.decision, decision.dataset.choice, decision); return; }

    const quarantine = target.closest("[data-quarantine]");
    if (quarantine) {
      const action = quarantine.dataset.quarantine;
      const armedRecently = quarantine.dataset.armed === "1" && Date.now() - Number(quarantine.dataset.armedAt || 0) > 400;
      if (action === "trash" && !armedRecently) {
        quarantine.dataset.armed = "1";
        quarantine.dataset.armedAt = String(Date.now());
        quarantine.textContent = "Confirm stage";
        setTimeout(() => {
          if (quarantine.isConnected) { quarantine.dataset.armed = "0"; quarantine.textContent = "Stage for deletion"; }
        }, 4000);
        return;
      }
      await quarantineAction(quarantine.dataset.rel, action, quarantine);
    }
  } catch (error) {
    toast(error.message, true);
  }
});

view.addEventListener("submit", async event => {
  event.preventDefault();
  try {
    if (event.target.id === "folder-form") {
      const path = $("#folder-path").value.trim();
      if (path) await addFolder(path);
    } else if (event.target.id === "lens-rule-form") {
      const submit = event.target.querySelector("[type='submit']");
      submit.disabled = true;
      try { await saveRule(Number(event.target.dataset.ruleIndex)); }
      finally { if (submit.isConnected) submit.disabled = false; }
    }
  } catch (error) {
    toast(error.message, true);
  }
});

view.addEventListener("change", event => {
  const picker = event.target.closest("select[data-picker]");
  if (!picker) return;
  const id = picker.dataset.picker;
  if (picker.value === "__custom__") {
    const input = document.createElement("input");
    input.type = "text";
    input.dataset.pickerCustom = id;
    input.placeholder = "Camera name substring";
    input.setAttribute("aria-label", "Custom camera name substring");
    picker.replaceWith(input);
    input.focus();
  } else if (picker.value && !pickers[id].includes(picker.value)) {
    pickers[id].push(picker.value);
    renderPicker(id);
  }
});

view.addEventListener("keydown", event => {
  const input = event.target.closest("input[data-picker-custom]");
  if (!input || event.key !== "Enter") return;
  event.preventDefault();
  const value = input.value.trim();
  if (value && !pickers[input.dataset.pickerCustom].includes(value)) pickers[input.dataset.pickerCustom].push(value);
  renderPicker(input.dataset.pickerCustom);
});

view.addEventListener("input", event => {
  if (event.target.matches("#rule-probe, #rule-camera")) probeRule();
});

async function render({ focus = true } = {}) {
  clearInterval(pollTimer);
  rawRoute = location.hash.slice(1) || "now";
  tab = normalizeRoute(rawRoute);
  renderTabs();
  document.title = `${TABS.find(([id]) => id === tab)[1]} · Camera Dropbox`;
  try {
    if (tab === "now") await renderNow();
    else {
      const page = tab === "library" ? renderLibrary()
        : tab === "attention" ? renderAttention()
        : renderAutomations();
      await Promise.all([page, refreshChrome()]);
    }
    if (focus) requestAnimationFrame(() => view.focus({ preventScroll: true }));
  } catch (error) {
    routeError(error);
    refreshChrome();
  }
  pollTimer = setInterval(async () => {
    try {
      if (tab === "now" && !document.hidden && !view.contains(document.activeElement)) await renderNow({ loading: false });
      else await refreshChrome();
    } catch (error) {
      await refreshChrome();
      toast(`Status refresh failed: ${error.message}`, true);
    }
  }, 8000);
}

window.addEventListener("hashchange", () => render());
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    if (tab === "now") renderNow({ loading: false }).catch(error => toast(error.message, true));
    else refreshChrome();
  }
});

renderTabs();
render();
</script>
</body>
</html>
